    const r=endMonth(G);
    if(G.bankrupt)return renderBankrupt(r);
    showResults(r);
  };
}

/* =====================================================================
   MODALS: bills, pitch, results
   ===================================================================== */
function showBills(){
  const rec=G.recurring, extra=[];
  if(G.crowdCollected)extra.push(`<tr><td>${ic("spark")} Crowdfunding payout</td><td class="good">+${fmt(G.crowdCollected)}</td></tr>`);
  if(G.bulkPaid)extra.push(`<tr><td>${ic("spark")} Corporate bulk order paid</td><td class="good">+${fmt(G.bulkPaid)}</td></tr>`);
  openModal(`
    <h2>${ic("cal")} ${MONTH_NAMES[G.month]} — bills are due</h2>
    <p class="small">Recurring costs deduct before you make a single decision. Doing nothing still burns cash.</p>
    <table class="ledger">
      ${rec.lines.map(l=>`<tr><td>${l[0]}</td><td style="color:var(--no)">−${fmt(l[1])}</td></tr>`).join("")}
      ${extra.join("")}
      <tr class="tot"><td>Cash after bills</td><td class="${G.cash>burnRate(G)?"good":"bad"}">${fmt(G.cash)}</td></tr>
    </table>
    ${G.famEmergency?`<div class="evt ${G.famEmergency.paid?"mixed":"bad"}">
      <b>${ic("alert")} Family emergency${G.famEmergency.paid?" — paid":" — couldn't pay!"}</b>
      <p class="small" style="margin-top:5px">${G.famEmergency.txt}</p></div>`:""}
    <div class="acts"><button class="btn primary" id="ok">Plan the month ${ic("caret")}</button></div>`);
  $("#ok").onclick=()=>{closeModal();renderGame();};
}
function showPitch(){
  const qs=investorQuestions(G);
  openModal(`
    <h2>${ic("users")} Investor pitch</h2>
    <p class="small">Answer at least 2 of 3 correctly about your own business. Success: +${fmt(INVESTOR_CASH)} for ${INVESTOR_EQUITY*100}% equity.</p>
    ${qs.map((q,i)=>`<div class="qa"><div class="q">${i+1}. ${q.q}</div>
      ${q.opts.map(o=>`<label class="opt"><input type="radio" name="q${i}" value="${o.correct?1:0}"><span>${o.label}</span></label>`).join("")}
    </div>`).join("")}
    <div class="acts"><button class="btn primary" id="go">Make the pitch</button><button class="btn ghost" id="no">Back out</button></div>`);
  $("#no").onclick=closeModal;
  $("#go").onclick=()=>{
    let c=0;
    for(let i=0;i<3;i++){const s=document.querySelector(`input[name=q${i}]:checked`); if(s&&s.value==="1")c++;}
    closeModal();
    const r=pitchInvestor(G,c);
    if(!r.ok)return toast(r.msg,"err");
    if(r.success)floatMoney(INVESTOR_CASH,"in");
    toast(r.msg,r.success?"earn":"err");
    renderGame();
  };
}
function showResults(r){
  const a=arch(G);
  const capped=r.sold<r.demand;
  const why=r.sold===r.cap&&r.cap<r.demand?"staff capacity":"inventory on hand";
  const net=r.profit;
  const extra=`
    <div class="srow res"><span class="lab">Customers who wanted to buy</span><span class="val">${r.demand}</span></div>
    <div class="srow res"><span class="lab">You sold at ${fmt(r.price)}${r.wasDiscounted?' <span class="tiny warn">(old-model discount)</span>':""}</span>
      <span class="val" style="color:${capped?"var(--no)":"var(--ok)"}">${r.sold}${capped?` <span class="tiny">— capped by ${why}</span>`:""}</span></div>`;
  const peek=nextMonthPreview(G,r);
  openModal(`
    <h2>${ic("chart")} ${MONTH_NAMES[r.month]} results</h2>
    <p class="small">The same stack you saw in the projection — now with the actual dice roll included.</p>
    ${stackRowsHTML(r.stack,extra)}
    ${r.event?`<div class="evt ${r.event.kind}"><b>${r.event.title}</b>
      <p class="small" style="margin-top:5px">${r.event.desc}</p></div>`:""}
    <table class="ledger">
      <tr><td>Revenue (${r.sold} × ${fmt(r.price)})</td><td class="good">+${fmt(r.revenue)}</td></tr>
      ${r.returns?`<tr><td>Returns &amp; defects</td><td class="bad">−${fmt(r.returns)}</td></tr>`:""}
      ${r.serviceRev?`<tr><td>${serviceName(G)}</td><td class="good">+${fmt(r.serviceRev)}</td></tr>`:""}
      <tr><td><span class="tt" data-tip="Cost of goods sold — what you originally paid for the units you sold this month.">COGS</span></td><td class="bad">−${fmt(r.cogs)}</td></tr>
      <tr><td>Operating costs (bills + spending)</td><td class="bad">−${fmt(r.opEx)}</td></tr>
      ${r.shrinkCost?`<tr><td><span class="tt" data-tip="Stock lost to theft or damage this month. A security upgrade cuts this from 2% to 0.5%.">Shrinkage</span> (${r.shrunk} units)</td><td class="bad">−${fmt(r.shrinkCost)}</td></tr>`:""}
      <tr class="tot"><td>Net profit</td><td class="${net>=0?"good":"bad"}">${net>=0?"+":"−"}${fmt(Math.abs(net))}</td></tr>
      <tr class="tot"><td>Cash balance</td><td class="${G.cash>5000?"good":"bad"}">${fmt(G.cash)}</td></tr>
      <tr><td>Inventory left</td><td>${r.unitsLeft} ${a.unitLabel}s (${fmt(inventoryValue(G))})</td></tr>
    </table>
    ${peek?`<div class="peek"><h4>${ic("eye")} Next month — ${MONTH_NAMES[G.month]}</h4>
      <ul>${peek.map(p=>`<li>${p}</li>`).join("")}</ul></div>`:""}
    <div class="acts"><button class="btn primary" id="next">
      ${G.phase==="won"?ic("trophy")+" See final results":"Continue to "+MONTH_NAMES[G.month]+" "+ic("caret")}</button></div>`);
  $("#next").onclick=()=>{
    closeModal();
    if(G.phase==="won")return renderVictory();
    beginMonth();
  };
}

/* =====================================================================
   END SCREENS
   ===================================================================== */
function confetti(){
  const c=document.createElement("canvas"); c.id="confetti";
  document.body.appendChild(c);
  const ctx=c.getContext("2d");
  const dpr=Math.min(2,devicePixelRatio||1);
  const size=()=>{c.width=innerWidth*dpr;c.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);};
  size();
  const cols=["#C2410C","#E8871E","#CA8A04","#7C4A52","#6F4E37","#F5D5A8"];
  const P=[];
  for(let i=0;i<150;i++)P.push({
    x:Math.random()*innerWidth, y:-30-Math.random()*innerHeight*0.7,
    w:5+Math.random()*7, h:8+Math.random()*10,
    vy:1.6+Math.random()*3.1, vx:-1.1+Math.random()*2.2,
    a:Math.random()*Math.PI, va:-.12+Math.random()*.24,
    c:cols[(Math.random()*cols.length)|0]
  });
  const t0=performance.now();
  (function frame(now){
    const el=now-t0;
    ctx.clearRect(0,0,innerWidth,innerHeight);
    let live=false;
    for(const p of P){
      p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
      if(p.y<innerHeight+40)live=true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
      ctx.globalAlpha=el>3600?Math.max(0,1-(el-3600)/1200):1;
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    }
    if(live&&el<4800)requestAnimationFrame(frame);
    else c.remove();
  })(t0);
}
function renderVictory(){
  const sc=finalScore(G), bl=badges(G,sc);
  const rev=G.history.reduce((x,r)=>x+r.revenue,0);
  const prof=G.history.reduce((x,r)=>x+r.profit,0);
  app.innerHTML=`
  <div class="finale">
    <div class="kicker">${ic("flag")} 12 months complete</div>
    <h1 style="margin-top:12px">You survived the year!</h1>
    <p class="small">${esc(G.storeName)} · ${esc(G.teamName)} · ${porterName(G.advantage,G.scope)}${G.nicheType?" ("+NICHES[G.nicheType].name+")":""}</p>
    <div class="score num" id="bigScore">$0</div>
    <div class="score-k">Final business valuation — write this on the board</div>
    <div class="badges">${bl.map((b,i)=>`<span class="badge" style="animation-delay:${.5+i*.14}s">${b}</span>`).join("")}</div>
    <p class="small">${ic("target")} ${strategyNote(G,sc)}</p>
  </div>
  <div class="card paper verdict"><h3>${ic("grid")} Porter verdict</h3><p class="small">${porterVerdict(G)}</p></div>
  <div class="grid">
    <div class="card"><h3>${ic("wallet")} Valuation breakdown</h3>
      <div class="spec"><span>Cash</span><b class="num">${fmt(sc.cash)}</b></div>
      <div class="spec"><span>Avg. profit last 3 months × 10</span><b class="num ${sc.profitComponent>=0?"good":"bad"}">${fmt(sc.profitComponent)}</b></div>
      <div class="spec"><span>Inventory &amp; assets</span><b class="num">${fmt(sc.inv+sc.assets)}</b></div>
      <div class="spec"><span>Bank debt</span><b class="num bad">−${fmt(sc.bankDebt)}</b></div>
      <div class="spec"><span>Unpaid family money</span><b class="num bad">−${fmt(sc.famDebt)}</b></div>
      <div class="spec"><span>× Ownership kept (${100-sc.equity*100}%)</span><b class="num">${fmt(sc.valuation)}</b></div>
    </div>
    <div class="card"><h3>${ic("chart")} Year in review</h3>
      <div class="spec"><span>Total revenue</span><b class="num">${fmt(rev)}</b></div>
      <div class="spec"><span>Total profit</span><b class="num ${prof>=0?"good":"bad"}">${fmt(prof)}</b></div>
      <div class="spec"><span>Profitable months</span><b>${G.history.filter(r=>r.profit>0).length} / 12</b></div>
      <div class="spec"><span>Final reputation</span><b>${Math.round(G.rep)}/100</b></div>
      <div class="spec"><span>Avg. strategy clarity</span><b>${Math.round(avgCoherence(G))}/100 (${clarityLabel(avgCoherence(G))})</b></div>
      <div class="spec"><span>Lowest cash point</span><b class="num ${G.minCash<2000?"bad":"good"}">${fmt(Math.max(0,G.minCash))}</b></div>
    </div>
  </div>
  ${chartHTML(true)}
  <div class="card"><h3>${ic("cap")} Debrief — discuss as a team</h3>
    <ol class="debrief">${debriefQuestions(G).map(q=>`<li>${q}</li>`).join("")}</ol></div>
  <div class="hero-cta"><button class="btn primary big" id="again">${ic("gear")} New Game</button></div>`;
  $("#again").onclick=renderSetup;
  wireChart();
  animateNum($("#bigScore"),0,sc.valuation,1400);
  setTimeout(confetti,260);
}
function renderBankrupt(){
  document.body.classList.add("doom");
  const drains=biggestDrains(G);
  const top=drains.find(d=>!/Recurring/.test(d[0]));
  let lesson="Cash is oxygen: profit on paper means nothing if the bank account hits zero first.";
  if(top&&/Inventory/.test(top[0])&&top[1]>8000)
    lesson="Inventory is cash wearing a disguise — buy what will sell this month, not what might sell someday.";
  else if(top&&/Marketing|Staffing|Improvements/.test(top[0])&&top[1]>3000)
    lesson="You spent on growth before the revenue existed to pay for it. Growth spending is great — when this month's sales can cover it.";
  else if(drains[0]&&/Recurring/.test(drains[0][0]))
    lesson="Rent and payroll burned every month whether you acted or not. Plan around the burn rate before planning for growth.";
  app.innerHTML=`
  <div class="finale">
    <div style="font-size:3.4rem;color:var(--terra)">${ic("skull","ic-lg")}</div>
    <h1 style="font-size:clamp(2rem,6vw,3rem);color:var(--terra)">BANKRUPT</h1>
    <p class="small">${esc(G.storeName)} closed its doors in ${MONTH_NAMES[G.month]} — month ${G.month+1} of 12.</p>
    <p class="small warn" style="font-weight:700">${G.bankruptWhy||""}</p>
  </div>
  <div class="card paper verdict"><h3>${ic("grid")} Porter verdict</h3><p class="small">${porterVerdict(G)}</p></div>
  <div class="grid">
    <div class="card"><h3>${ic("wallet")} Biggest cash drains</h3>
      ${drains.map(d=>`<div class="spec"><span>${d[0]}</span><b class="num bad">−${fmt(d[1])}</b></div>`).join("")}</div>
    <div class="card"><h3>${ic("cal")} How it happened</h3>
      <ul class="tl-list">${G.log.slice(-11).map(l=>`<li><b>${MONTH_NAMES[Math.min(11,l.m)]}:</b> ${l.txt}</li>`).join("")}</ul></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>${ic("bulb")} The lesson</h3>
    <p class="small">${lesson}</p></div>
  <div class="card" style="margin-top:14px"><h3>${ic("cap")} Debrief — discuss as a team</h3>
    <ol class="debrief">${debriefQuestions(G).map(q=>`<li>${q}</li>`).join("")}</ol></div>
  <div class="hero-cta"><button class="btn primary big" id="again">${ic("gear")} New Game</button></div>`;
  $("#again").onclick=()=>{document.body.classList.remove("doom");renderSetup();};
}

renderSetup();
</script>
