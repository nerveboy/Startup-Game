<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circuit Startup — Deluxe Edition</title>
<style>
/* ============================================================
   SURFACE SYSTEM
   Every component reads --t1/--t2/--t3 (text) and --bd (borders)
   from whichever surface it sits on. No specificity wars.
   ============================================================ */
:root{
  /* warm paper */
  --paper:#EADDCA; --paper-lo:#DCCAAE; --paper-hi:#F7F0E4;
  /* coffee cards */
  --card:#6F4E37; --card-hi:#7D5B43; --card-lo:#573B29;
  /* accents */
  --terra:#C2410C; --terra-lo:#9A3308; --amber:#E8871E; --gold:#CA8A04;
  --plum:#7C4A52;
  /* chart */
  --chart:#F59E0B; --chart2:#EA6C0B;
  --radius:16px; --radius-sm:11px;
  --shadow-1:0 1px 2px rgba(74,48,28,.14), 0 3px 8px rgba(74,48,28,.10);
  --shadow-2:0 2px 4px rgba(74,48,28,.16), 0 10px 26px rgba(74,48,28,.16);
  --shadow-3:0 4px 8px rgba(74,48,28,.18), 0 22px 50px rgba(74,48,28,.22);
  --ease:cubic-bezier(.22,.9,.28,1);
  font-size:15px;
  /* default surface = light paper */
  --t1:#3A2A1A; --t2:#6B5540; --t3:#8E7458;
  --bd:rgba(90,62,43,.20); --bd-2:rgba(90,62,43,.34);
  --ok:#2F7D32; --no:#B3261E; --hm:#9A5B06;
  --fieldbg:#FBF6EE; --fieldbd:#C3A985;
}
.surface-dark{
  --t1:#FDF6EC; --t2:#E7D8C4; --t3:#BFA98F;
  --bd:rgba(255,255,255,.15); --bd-2:rgba(255,255,255,.30);
  --ok:#7BE495; --no:#FF97AA; --hm:#FFC46B;
  --fieldbg:rgba(0,0,0,.22); --fieldbd:rgba(255,255,255,.25);
  color:var(--t1);
}
.surface-light{
  --t1:#3A2A1A; --t2:#6B5540; --t3:#8E7458;
  --bd:rgba(90,62,43,.20); --bd-2:rgba(90,62,43,.34);
  --ok:#2F7D32; --no:#B3261E; --hm:#9A5B06;
  --fieldbg:#FBF6EE; --fieldbd:#C3A985;
  color:var(--t1);
}

*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth}
body{
  background:
    /* paper grain */
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.055'/></svg>"),
    radial-gradient(900px 520px at 88% -6%, rgba(232,135,30,.22), transparent 62%),
    radial-gradient(760px 460px at 4% 100%, rgba(124,74,82,.16), transparent 60%),
    linear-gradient(178deg, var(--paper-hi) 0%, var(--paper) 42%, var(--paper-lo) 100%);
  background-attachment:fixed, fixed, fixed, fixed;
  color:var(--t1);
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh; overflow-x:hidden;
}
button,input{font-family:inherit}
h1,h2,h3{font-weight:800; letter-spacing:-.015em; line-height:1.18}
.wrap{max-width:1200px; margin:0 auto; padding:0 20px 72px}
.small{font-size:.83rem; color:var(--t2); line-height:1.5}
.tiny{font-size:.735rem; color:var(--t3); line-height:1.45}
.num{font-variant-numeric:tabular-nums;
  font-family:"Cascadia Mono",Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace}
.good{color:var(--ok)} .bad{color:var(--no)} .warn{color:var(--hm)}
.hidden{display:none !important}
.center{text-align:center}

/* ---------- icons ---------- */
.ic{width:1.15em; height:1.15em; flex:none; vertical-align:-.16em}
.ic-lg{width:26px; height:26px}
#sprite{position:absolute; width:0; height:0; overflow:hidden}

/* ---------- cards ---------- */
.card{
  position:relative; border-radius:var(--radius); padding:18px;
  background:linear-gradient(168deg, var(--card-hi), var(--card) 46%, var(--card-lo));
  border:1px solid rgba(40,24,12,.34);
  box-shadow:var(--shadow-2), inset 0 1px 0 rgba(255,255,255,.10);
  /* cards are dark coffee → adopt the dark text/border set */
  --t1:#FDF6EC; --t2:#E7D8C4; --t3:#BFA98F;
  --bd:rgba(255,255,255,.15); --bd-2:rgba(255,255,255,.30);
  --ok:#7BE495; --no:#FF97AA; --hm:#FFC46B;
  --fieldbg:rgba(0,0,0,.24); --fieldbd:rgba(255,255,255,.26);
  color:var(--t1);
}
.card::after{ /* soft top sheen */
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.07), transparent 38%);
}
.card.paper{
  background:linear-gradient(168deg, #FBF4E8, #F1E5D2 60%, #E9DAC3);
  border-color:rgba(120,86,56,.28);
  /* cream panel → revert to the light text/border set */
  --t1:#3A2A1A; --t2:#6B5540; --t3:#8E7458;
  --bd:rgba(90,62,43,.20); --bd-2:rgba(90,62,43,.34);
  --ok:#2F7D32; --no:#B3261E; --hm:#9A5B06;
  --fieldbg:#FBF6EE; --fieldbd:#C3A985;
  color:var(--t1);
}
.card > *{position:relative; z-index:1}
.card h3{font-size:1rem; display:flex; align-items:center; gap:9px; margin-bottom:10px}
.card h3 .ic{color:var(--amber)}
.card.paper h3 .ic{color:var(--terra)}

/* ---------- buttons ---------- */
.btn{
  cursor:pointer; border:1px solid var(--fieldbd); border-radius:var(--radius-sm);
  background:linear-gradient(180deg,#FBF3E7,#EDDFC7); color:#3A2A1A;
  padding:8px 14px; font-size:.875rem; font-weight:600; white-space:nowrap;
  display:inline-flex; align-items:center; gap:7px;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset, var(--shadow-1);
  transition:transform .09s var(--ease), filter .15s, box-shadow .15s;
}
.btn:hover{filter:brightness(1.04); box-shadow:0 1px 0 rgba(255,255,255,.7) inset, var(--shadow-2); transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn:disabled{opacity:.42; cursor:not-allowed; transform:none; filter:grayscale(.35)}
.btn .cost{color:var(--terra); font-weight:800; font-variant-numeric:tabular-nums}
.btn.primary{
  background:linear-gradient(180deg,#E5711A,#C2410C 60%,#A83809); color:#FFF6EC;
  border-color:#8F3208; box-shadow:0 1px 0 rgba(255,255,255,.28) inset, 0 6px 18px rgba(194,65,12,.34);
}
.btn.primary .cost{color:#FFE0BC}
.btn.danger{background:linear-gradient(180deg,#B1444E,#8E2F3B); color:#FFF1F1; border-color:#7A2632}
.btn.danger .cost{color:#FFD9DD}
.btn.ghost{background:transparent; box-shadow:none; border-color:var(--bd-2); color:var(--t1)}
.btn.big{font-size:1.05rem; padding:14px 30px; border-radius:14px}
.btn-col{display:flex; flex-direction:column; gap:6px}

/* ---------- tooltips ---------- */
.tt{border-bottom:1.5px dotted currentColor; cursor:help; position:relative}
/* NOTE: `content` is deliberately only set on :hover. A pseudo-element with
   content:normal generates no box, so hidden tooltips can't leak scroll width
   out of narrow containers (they did, on mobile). */
.tt::after{
  position:absolute; left:50%; bottom:150%; z-index:80; width:250px;
  transform:translate(-50%,0); pointer-events:none;
  background:#2E2016; border:1px solid rgba(232,135,30,.55); color:#FDF6EC;
  padding:10px 12px; border-radius:12px; font-size:.775rem; line-height:1.45; font-weight:400;
  box-shadow:var(--shadow-3);
}
.tt:hover::after,.tt:focus::after{content:attr(data-tip)}

/* ============================ HUD ============================ */
.hud{
  position:sticky; top:0; z-index:60; margin:0 -20px 14px; padding:10px 20px;
  background:linear-gradient(180deg,#F2E8D8,#E8DAC3);
  border-bottom:1px solid rgba(120,86,56,.30);
  box-shadow:0 4px 14px rgba(74,48,28,.13);
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.hud-brand{display:flex; align-items:center; gap:11px; min-width:0}
.hud-mark{
  width:38px; height:38px; border-radius:11px; flex:none; display:grid; place-items:center;
  background:linear-gradient(150deg,var(--amber),var(--terra)); color:#fff;
  box-shadow:0 4px 12px rgba(194,65,12,.36), inset 0 1px 0 rgba(255,255,255,.4);
}
.hud-name{font-weight:800; font-size:1.02rem; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hud-sub{font-size:.7rem; color:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hud-spacer{flex:1}
.hud-stat{display:flex; flex-direction:column; align-items:flex-end; line-height:1.1}
.hud-stat .k{font-size:.62rem; letter-spacing:.09em; text-transform:uppercase; color:var(--t3); font-weight:700}
.hud-stat .v{font-size:1.32rem; font-weight:800}
.hud-stat.sm .v{font-size:1rem}
.cash-good{color:#2F7D32} .cash-warn{color:#A15C07} .cash-bad{color:#B3261E}
@keyframes cashPulse{0%{transform:scale(1)}35%{transform:scale(1.13)}100%{transform:scale(1)}}
.pulse{animation:cashPulse .5s var(--ease)}

/* ---------- month timeline ---------- */
.timeline{display:flex; gap:5px; margin:0 0 16px}
.tl{
  flex:1; min-width:0; border-radius:9px; padding:7px 3px 6px; text-align:center;
  border:1px solid var(--bd); background:rgba(255,255,255,.34);
  font-size:.68rem; font-weight:700; color:var(--t3); position:relative;
  transition:transform .2s var(--ease), box-shadow .2s;
}
.tl .m{font-size:.78rem; color:var(--t2)}
.tl .s{display:block; font-size:.62rem; font-weight:600; margin-top:1px}
.tl.bump{background:linear-gradient(180deg,rgba(232,135,30,.20),rgba(232,135,30,.10)); border-color:rgba(232,135,30,.45)}
.tl.peak{background:linear-gradient(180deg,rgba(194,65,12,.26),rgba(194,65,12,.13)); border-color:rgba(194,65,12,.5)}
.tl.slump{background:rgba(124,74,82,.10)}
.tl.done{opacity:.62}
.tl.done .dot{position:absolute; top:4px; right:5px; width:6px; height:6px; border-radius:50%}
.tl.now{
  color:#FDF6EC; border-color:#5A3E2B; transform:translateY(-3px);
  background:linear-gradient(168deg,var(--card-hi),var(--card-lo));
  box-shadow:0 8px 20px rgba(74,48,28,.34);
}
.tl.now .m,.tl.now .s{color:#FDF6EC}

/* ---------- stat tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:12px; margin-bottom:16px}
.tile{padding:14px 15px}
.tile .k{font-size:.64rem; letter-spacing:.1em; text-transform:uppercase; color:var(--t3); font-weight:800;
  display:flex; align-items:center; gap:6px}
.tile .v{font-size:1.42rem; font-weight:800; margin-top:5px; line-height:1.1}
.tile .sub{font-size:.71rem; color:var(--t3); margin-top:3px}
.tile-gauge{display:flex; align-items:center; gap:12px}
.gauge-wrap{position:relative; width:60px; height:60px; flex:none}
.gauge-wrap .gv{position:absolute; inset:0; display:grid; place-items:center; font-size:.9rem; font-weight:800}
.gauge-bg{stroke:rgba(255,255,255,.16)}
@keyframes dashIn{from{stroke-dashoffset:var(--full)}}
.gauge-fg{transition:stroke-dashoffset .7s var(--ease); animation:dashIn .7s var(--ease)}

/* ============================ PROJECTION ============================ */
.proj{margin-bottom:16px; border-color:rgba(232,135,30,.5); box-shadow:var(--shadow-2), 0 0 0 1px rgba(232,135,30,.22), inset 0 1px 0 rgba(255,255,255,.1)}
.proj h3 .ic{color:var(--chart)}
.stack{margin-top:4px}
.srow{display:flex; align-items:center; gap:12px; padding:6px 0; border-bottom:1px dashed var(--bd); font-size:.845rem}
.srow:last-child{border-bottom:none}
.srow .lab{flex:1; min-width:0; color:var(--t2)}
.srow .bar{width:120px; flex:none; height:9px; position:relative; border-radius:5px; background:rgba(0,0,0,.2)}
.srow .bar::before{content:""; position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:var(--bd-2)}
.srow .bar i{position:absolute; top:0; bottom:0; border-radius:4px; transition:width .5s var(--ease)}
.srow .bar i.p{left:50%; background:linear-gradient(90deg,#5FBF74,#7BE495)}
.srow .bar i.n{right:50%; background:linear-gradient(270deg,#D9556B,#FF97AA)}
.srow .val{width:64px; flex:none; text-align:right; font-weight:800; font-variant-numeric:tabular-nums}
.srow.base{border-bottom:1px solid var(--bd-2)}
.srow.base .lab{color:var(--t1); font-weight:700}
.srow.res{border-top:1px solid var(--bd-2); border-bottom:none; margin-top:4px; padding-top:9px; font-size:.9rem}
.srow.res .lab{color:var(--t1); font-weight:700}
.srow.res .val{width:auto; color:var(--t1)}
.srow .val.p{color:var(--ok)} .srow .val.n{color:var(--no)} .srow .val.z{color:var(--t3)}
.bindwarn{margin-top:11px; padding:10px 12px; border-radius:var(--radius-sm); font-size:.82rem;
  border:1px solid rgba(255,196,107,.5); background:rgba(255,196,107,.13); color:#FFD9A0;
  display:flex; gap:9px; align-items:flex-start}
.bindwarn .ic{color:#FFC46B; margin-top:1px}
.disclaim{margin-top:9px; font-size:.735rem; color:var(--t3); display:flex; align-items:center; gap:6px}

/* ============================ CHART ============================ */
.chart-card{margin-bottom:16px}
.chart-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px}
.chart-host{position:relative}
.chart-host svg{width:100%; height:172px; display:block; overflow:visible}
.grid-l{stroke:rgba(255,255,255,.13); stroke-width:1}
.axis-t{fill:var(--t3); font-size:10px; font-family:inherit}
.cline{fill:none; stroke:var(--chart); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round;
  filter:drop-shadow(0 2px 5px rgba(245,158,11,.4))}
@keyframes draw{from{stroke-dashoffset:var(--len)}}
.cline.anim{stroke-dasharray:var(--len); animation:draw 1.1s var(--ease) forwards}
.cdot{fill:var(--chart); stroke:var(--card); stroke-width:2}
.cdot.hot{r:6}
.clabel{fill:var(--t1); font-size:11px; font-weight:800; font-family:inherit}
.crosshair{stroke:rgba(255,255,255,.4); stroke-width:1; stroke-dasharray:3 3}
.ctip{
  position:absolute; pointer-events:none; z-index:20; transform:translate(-50%,-135%);
  background:#2E2016; color:#FDF6EC; border:1px solid rgba(232,135,30,.5);
  padding:6px 10px; border-radius:9px; font-size:.76rem; white-space:nowrap;
  box-shadow:var(--shadow-2); opacity:0; transition:opacity .12s;
}
.ctip .cv{font-weight:800; font-variant-numeric:tabular-nums}

/* ============================ DECISIONS ============================ */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px}
@keyframes riseIn{from{opacity:0; transform:translateY(14px)}}
.rise{animation:riseIn .42s var(--ease) both}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:9px 0; border-bottom:1px dashed var(--bd)}
.row:last-child{border-bottom:none}
.row .d{flex:1; min-width:0; font-size:.835rem; color:var(--t2); line-height:1.45}
.row .d b{color:var(--t1); font-weight:700}
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px;
  font-size:.7rem; font-weight:700; border:1px solid var(--bd-2); color:var(--t2); margin-left:auto}
.chip-on{color:var(--ok); font-weight:800; font-size:.79rem; display:inline-flex; align-items:center; gap:5px}
.flag-off{display:inline-flex; align-items:center; gap:4px; color:#FF97AA; font-size:.72rem; font-weight:800; margin-top:2px}
.qty{display:flex; align-items:center; gap:7px}
.qty input{width:78px; text-align:center; padding:7px 6px; border-radius:9px; font-weight:700;
  border:1px solid var(--fieldbd); background:var(--fieldbg); color:var(--t1);
  font-variant-numeric:tabular-nums}
.qty input:focus{outline:none; border-color:var(--amber); box-shadow:0 0 0 3px rgba(232,135,30,.25)}
.hero-cta{text-align:center; margin:26px 0 0}
@keyframes glowPulse{0%,100%{box-shadow:0 1px 0 rgba(255,255,255,.28) inset, 0 6px 18px rgba(194,65,12,.34)}
  50%{box-shadow:0 1px 0 rgba(255,255,255,.28) inset, 0 8px 30px rgba(194,65,12,.6)}}
.hero-cta .btn{animation:glowPulse 2.6s ease-in-out infinite}

/* ============================ SETUP ============================ */
.hero{padding:40px 0 20px; text-align:center; position:relative}
.hero .logo{
  font-size:clamp(2.2rem,5.4vw,3.3rem); font-weight:900; letter-spacing:-.03em;
  background:linear-gradient(96deg,var(--terra),var(--amber) 48%,var(--gold));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 3px 10px rgba(194,65,12,.26));
}
.hero .tag{font-size:1rem; color:var(--t2); margin-top:8px}
.hero .kicker{display:inline-flex; align-items:center; gap:7px; padding:5px 14px; border-radius:999px;
  background:rgba(194,65,12,.11); border:1px solid rgba(194,65,12,.28); color:var(--terra);
  font-size:.73rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase}
.step{display:flex; align-items:center; gap:11px; margin:26px 0 12px}
.step .n{width:30px; height:30px; border-radius:9px; flex:none; display:grid; place-items:center;
  background:linear-gradient(150deg,var(--card-hi),var(--card-lo)); color:#FDF6EC; font-weight:800; font-size:.9rem;
  box-shadow:var(--shadow-1)}
.step h2{font-size:1.16rem}
.step .hint{font-size:.8rem; color:var(--t3); margin-left:auto; text-align:right}
.pick{cursor:pointer; transition:transform .18s var(--ease), box-shadow .18s}
.pick:hover{transform:translateY(-3px); box-shadow:var(--shadow-3)}
.pick.sel{outline:3px solid var(--amber); outline-offset:2px}
.pick.sel::before{
  content:"✓"; position:absolute; top:-11px; right:-11px; z-index:3; width:28px; height:28px; border-radius:50%;
  background:linear-gradient(150deg,var(--amber),var(--terra)); color:#fff; display:grid; place-items:center;
  font-weight:900; font-size:.85rem; box-shadow:0 4px 12px rgba(194,65,12,.45)
}
.pick-head{display:flex; align-items:center; gap:12px; margin-bottom:8px}
.pick-head .ic-lg{color:var(--amber)}
.pick-head h3{font-size:1.1rem; margin:0}
.spec{display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:.815rem; border-bottom:1px dashed var(--bd)}
.spec:last-of-type{border-bottom:none}
.spec span{color:var(--t2)} .spec b{color:var(--t1); text-align:right}
.risk{margin-top:9px; font-size:.755rem; color:var(--t3); display:flex; gap:7px; align-items:flex-start}
.risk .ic{color:#FFC46B; flex:none; margin-top:1px}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 4px}
.chip{cursor:pointer; padding:8px 13px; border-radius:10px; font-size:.85rem; font-weight:700;
  border:1px solid var(--bd-2); background:rgba(0,0,0,.16); color:var(--t1);
  display:inline-flex; align-items:center; gap:7px; transition:transform .14s var(--ease)}
.chip:hover{transform:translateY(-2px)}
.chip.sel{background:linear-gradient(150deg,var(--amber),var(--terra)); color:#fff; border-color:transparent;
  box-shadow:0 5px 14px rgba(194,65,12,.4)}
.fields{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.fields label{display:block; font-size:.74rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--t3); margin-bottom:6px}
.fields input{width:100%; padding:12px 14px; border-radius:11px; font-size:1rem; font-weight:600;
  border:1px solid var(--fieldbd); background:var(--fieldbg); color:var(--t1)}
.fields input:focus{outline:none; border-color:var(--amber); box-shadow:0 0 0 3px rgba(232,135,30,.25)}

/* ---------- Porter 2x2 matrix ---------- */
.matrix-card{margin-top:18px}
.matrix{display:grid; grid-template-columns:auto minmax(0,1fr) minmax(0,1fr); grid-template-rows:auto 1fr 1fr; gap:9px; margin-top:6px}
/* explicit placement — immune to hidden/reordered children */
.mx-corner{grid-area:1/1} .mx-c1{grid-area:1/2} .mx-c2{grid-area:1/3}
.mx-r1{grid-area:2/1} .mx-a{grid-area:2/2} .mx-b{grid-area:2/3}
.mx-r2{grid-area:3/1} .mx-c{grid-area:3/2} .mx-d{grid-area:3/3}
.mx-ch{display:grid; place-items:center; font-size:.7rem; font-weight:800; letter-spacing:.1em;
  text-transform:uppercase; color:var(--t3); text-align:center; padding:2px}
.mx-rh{writing-mode:vertical-rl; transform:rotate(180deg)}
.mx-cell{
  border-radius:13px; padding:13px 14px; border:1.5px dashed var(--bd-2);
  background:rgba(0,0,0,.13); transition:all .3s var(--ease); min-height:88px;
}
.mx-cell .n{font-weight:800; font-size:.95rem; color:var(--t2)}
.mx-cell .x{font-size:.75rem; color:var(--t3); margin-top:3px; line-height:1.4}
.mx-cell.on{
  border-style:solid; border-color:transparent; transform:scale(1.035);
  background:linear-gradient(150deg,var(--amber),var(--terra));
  box-shadow:0 10px 26px rgba(194,65,12,.4);
}
.mx-cell.on .n{color:#fff} .mx-cell.on .x{color:rgba(255,255,255,.9)}
.mid-warn{margin-top:12px; padding:11px 13px; border-radius:12px; font-size:.8rem; line-height:1.5;
  border:1px solid rgba(255,196,107,.45); background:rgba(255,196,107,.12); color:#FFD9A0;
  display:flex; gap:9px; align-items:flex-start}
.mid-warn .ic{color:#FFC46B; flex:none; margin-top:2px}
.summary{margin-top:14px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center}
.sum-box{padding:9px 15px; border-radius:12px; background:rgba(0,0,0,.18); border:1px solid var(--bd);
  text-align:center; min-width:130px}
.sum-box .k{font-size:.63rem; letter-spacing:.09em; text-transform:uppercase; color:var(--t3); font-weight:800}
.sum-box .v{font-size:1.1rem; font-weight:800; margin-top:2px}

/* ============================ MODALS ============================ */
.scrim{position:fixed; inset:0; z-index:120; padding:18px; overflow:auto;
  background:rgba(46,32,22,.62); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  display:flex; align-items:flex-start; justify-content:center; animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0; transform:translateY(18px) scale(.97)}}
.sheet{width:100%; max-width:680px; margin:auto; animation:popIn .3s var(--ease)}
.sheet h2{font-size:1.35rem; display:flex; align-items:center; gap:10px; margin-bottom:4px}
.sheet h2 .ic{color:var(--amber)}
.ledger{width:100%; border-collapse:collapse; margin:10px 0}
.ledger td{padding:7px 4px; font-size:.87rem; border-bottom:1px dashed var(--bd); color:var(--t2)}
.ledger td:last-child{text-align:right; font-variant-numeric:tabular-nums; font-weight:700; color:var(--t1)}
.ledger tr.tot td{border-top:1.5px solid var(--bd-2); border-bottom:none; font-weight:800; font-size:.94rem; color:var(--t1)}
.evt{border-radius:13px; padding:13px 15px; margin:12px 0; border:1px solid var(--bd-2); background:rgba(0,0,0,.16)}
.evt b{display:flex; align-items:center; gap:8px; font-size:.97rem}
.evt.good{border-color:rgba(123,228,149,.5); background:rgba(123,228,149,.10)}
.evt.bad{border-color:rgba(255,151,170,.5); background:rgba(255,151,170,.10)}
.evt.mixed{border-color:rgba(255,196,107,.5); background:rgba(255,196,107,.10)}
.peek{margin-top:13px; padding:13px 15px; border-radius:13px; border:1px dashed var(--bd-2); background:rgba(0,0,0,.13)}
.peek h4{font-size:.83rem; font-weight:800; display:flex; align-items:center; gap:8px; margin-bottom:6px}
.peek h4 .ic{color:var(--amber)}
.peek li{list-style:none; font-size:.8rem; color:var(--t2); padding:3px 0 3px 2px; line-height:1.45}
.qa{margin:12px 0}
.qa .q{font-weight:700; font-size:.92rem; margin-bottom:6px}
.opt{display:flex; align-items:center; gap:9px; padding:9px 12px; margin:5px 0; border-radius:10px; cursor:pointer;
  border:1px solid var(--bd); background:rgba(0,0,0,.14); font-size:.88rem; transition:all .15s}
.opt:hover{border-color:var(--amber); background:rgba(232,135,30,.13)}
.opt input{accent-color:var(--terra); width:16px; height:16px}
.acts{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
.acts .btn{flex:1; justify-content:center}

/* ============================ TOASTS ============================ */
#toasts{position:fixed; right:18px; top:78px; z-index:200; display:flex; flex-direction:column; gap:9px; max-width:330px}
@keyframes slideIn{from{opacity:0; transform:translateX(26px)}}
.toast{
  background:linear-gradient(168deg,#FBF4E8,#EFE2CD); color:#3A2A1A; border:1px solid rgba(120,86,56,.3);
  border-left:4px solid var(--amber); padding:11px 14px; border-radius:12px; font-size:.85rem; line-height:1.45;
  box-shadow:var(--shadow-3); animation:slideIn .28s var(--ease); display:flex; gap:9px; align-items:flex-start;
}
.toast .ic{flex:none; margin-top:1px; color:var(--amber)}
.toast.earn{border-left-color:#2F7D32} .toast.earn .ic{color:#2F7D32}
.toast.spend{border-left-color:var(--terra)} .toast.spend .ic{color:var(--terra)}
.toast.err{border-left-color:#B3261E} .toast.err .ic{color:#B3261E}
.toast.fade{opacity:0; transform:translateX(26px); transition:all .3s}

/* floating money */
@keyframes floatUp{
  0%{opacity:0; transform:translate(-50%,0) scale(.85)}
  18%{opacity:1; transform:translate(-50%,-14px) scale(1.06)}
  100%{opacity:0; transform:translate(-50%,-74px) scale(1)}
}
.fmoney{position:fixed; z-index:210; pointer-events:none; font-weight:900; font-size:1.25rem;
  font-variant-numeric:tabular-nums; text-shadow:0 2px 8px rgba(0,0,0,.3); animation:floatUp 1.25s var(--ease) forwards}
.fmoney.out{color:#C2410C} .fmoney.in{color:#2F7D32}

/* ============================ END SCREENS ============================ */
.finale{text-align:center; padding:34px 0 8px; position:relative}
.finale h1{font-size:clamp(1.7rem,4.4vw,2.5rem)}
.score{
  font-size:clamp(3rem,10vw,5.2rem); font-weight:900; letter-spacing:-.035em; margin:6px 0 2px;
  background:linear-gradient(96deg,var(--terra),var(--amber) 46%,var(--gold));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 14px rgba(194,65,12,.3)); font-variant-numeric:tabular-nums;
}
.score-k{font-size:.76rem; letter-spacing:.16em; text-transform:uppercase; font-weight:800; color:var(--t2)}
.badges{display:flex; gap:11px; flex-wrap:wrap; justify-content:center; margin:18px 0 10px}
@keyframes badgeIn{from{opacity:0; transform:scale(.7) rotate(-6deg)}}
.badge{padding:10px 17px; border-radius:13px; font-weight:800; font-size:.92rem;
  background:linear-gradient(168deg,#FBF4E8,#EFDFC6); color:#3A2A1A;
  border:1.5px solid var(--gold); box-shadow:var(--shadow-2); animation:badgeIn .5s var(--ease) both}
.verdict{margin:18px 0}
.verdict h3 .ic{color:var(--terra)}
.tl-list li{list-style:none; padding:7px 0 7px 15px; border-left:2px solid var(--bd-2); font-size:.845rem; color:var(--t2); line-height:1.5}
.tl-list li b{color:var(--t1)}
.debrief li{margin:0 0 13px 20px; font-size:.92rem; line-height:1.55; color:var(--t2)}
.debrief li::marker{color:var(--amber); font-weight:800}
#confetti{position:fixed; inset:0; z-index:150; pointer-events:none}
.doom{filter:grayscale(.35)}
.doom .card{background:linear-gradient(168deg,#5E4335,#4A3327 60%,#3C2A20)}

/* ============================ GUIDE ============================ */
.guide{font-size:.885rem; line-height:1.62; color:var(--t2)}
.guide h3{font-size:.98rem; color:var(--t1); margin:18px 0 6px; display:flex; align-items:center; gap:8px}
.guide h3:first-child{margin-top:0}
.guide h3 .ic{color:var(--amber)}
.guide b{color:var(--t1)}
.guide ul{margin:6px 0 6px 22px}
.guide li{margin:4px 0}
.guide .ex{background:rgba(0,0,0,.2); border:1px solid var(--bd); border-left:3px solid var(--amber);
  border-radius:11px; padding:12px 14px; margin:9px 0; font-size:.83rem}
.guide .term{display:inline-block; margin:3px 5px 3px 0}
details.fold{margin:14px 0}
details.fold summary{cursor:pointer; font-weight:800; color:var(--terra); font-size:.92rem;
  display:flex; align-items:center; gap:8px; list-style:none; padding:9px 0}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary .ic{transition:transform .2s var(--ease)}
details.fold[open] summary .ic.caret{transform:rotate(90deg)}

/* ============================================================
   MOBILE / TOUCH  —  single-column, 44px touch targets,
   scrollable timeline, stacked decision rows, larger type.
   ============================================================ */
@media (max-width:760px){
  :root{font-size:16px}   /* must be :root — it out-specifies a bare html selector */
  .wrap{padding:0 14px 56px}

  /* --- HUD: one tight row, never wraps --- */
  .hud{margin:0 -14px 12px; padding:9px 14px; gap:10px; flex-wrap:nowrap}
  .hud-mark{width:34px; height:34px; border-radius:10px}
  .hud-name{font-size:.94rem; max-width:40vw}
  .hud-sub{font-size:.72rem; max-width:40vw}
  .hud-stat .v{font-size:1.18rem}
  .hud-stat .k{font-size:.7rem}
  .hud-stat.hide-sm{display:none}
  .hud .btn{padding:9px 11px; min-height:38px; font-size:.8rem}

  /* --- timeline: one horizontally scrollable strip --- */
  .timeline{
    margin:0 -14px 14px; padding:2px 14px 4px; gap:6px;
    overflow-x:auto; scroll-snap-type:x proximity;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .timeline::-webkit-scrollbar{display:none}
  .tl{flex:0 0 66px; scroll-snap-align:center; padding:8px 4px 7px}
  .tl .m{font-size:.84rem} .tl .s{font-size:.68rem}

  /* --- tiles --- */
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:14px}
  .tile.wide{grid-column:1/-1}   /* gauge tiles get the full width */
  .tile{padding:13px 13px}
  .tile .k{font-size:.7rem; letter-spacing:.07em}
  .tile .v{font-size:1.3rem}
  .tile .sub{font-size:.75rem}
  .pill{font-size:.74rem}
  .tiny{font-size:.775rem}
  .axis-t{font-size:11.5px} .clabel{font-size:12.5px}
  .tile-gauge{gap:10px}
  .gauge-wrap{width:52px; height:52px}
  .gauge-wrap svg{width:52px; height:52px}

  /* --- demand stack: drop the bar column, give the label room --- */
  .srow{gap:10px; padding:8px 0; font-size:.88rem}
  .srow .bar{display:none}
  .srow .val{width:58px}
  .srow.res{flex-wrap:wrap; row-gap:2px}
  .srow.res .lab{flex:1 0 100%}
  .srow.res .val{width:auto; margin-left:auto}

  /* --- decision rows stack vertically --- */
  .row{flex-direction:column; align-items:stretch; gap:9px; padding:12px 0}
  .row .d{font-size:.9rem}
  .row .btn{width:100%; justify-content:center}
  .btn-col{flex-direction:row}
  .btn-col .btn{flex:1}
  .pill{margin-left:0; align-self:flex-start}
  .card h3{flex-wrap:wrap; row-gap:6px}
  .qty{width:100%}
  .qty input{flex:1; width:auto; height:46px; font-size:1rem}
  .qty .btn{flex:0 0 auto; width:auto}

  /* --- touch targets --- */
  .btn{min-height:44px; padding:11px 15px; white-space:normal; max-width:100%}
  .btn.big{width:100%; font-size:1rem; padding:16px 14px}
  .chip{min-height:44px; padding:10px 14px}
  .opt{min-height:46px}

  /* --- chart --- */
  .chart-host svg{height:196px}
  .chart-head{flex-direction:column; align-items:flex-start; gap:1px}

  /* --- modals --- */
  .scrim{padding:10px}
  .sheet{padding:15px}
  .sheet h2{font-size:1.16rem}
  .acts{flex-direction:column-reverse}
  .acts .btn{width:100%}
  .ledger td{font-size:.85rem; padding:8px 3px}

  /* --- setup --- */
  .hero{padding:26px 0 12px}
  /* minmax(0,…) lets tracks shrink below min-content (inputs have an intrinsic min width) */
  .grid{grid-template-columns:minmax(0,1fr)}
  .card,.row,.row .d,.qty,.btn-col,.tile,.srow,.srow .lab{min-width:0}
  .qty input{min-width:0}
  .fields{grid-template-columns:minmax(0,1fr); gap:12px}
  .step{flex-wrap:wrap; margin:22px 0 10px}
  .step h2{font-size:1.08rem}
  .step .hint{margin-left:0; flex:1 0 100%; text-align:left; margin-top:2px}
  .pick:hover{transform:none}
  .spec{font-size:.85rem}
  .summary{gap:8px}
  .sum-box{flex:1 1 100%; min-width:0}

  /* keep the 2x2 matrix a real 2x2, just compact */
  .matrix{grid-template-columns:17px minmax(0,1fr) minmax(0,1fr); gap:6px}
  .mx-ch{font-size:.58rem; letter-spacing:.02em}
  .mx-cell{padding:10px 9px; min-height:78px; border-radius:11px}
  .mx-cell .n{font-size:.79rem} .mx-cell .x{font-size:.67rem; margin-top:2px}
  .mx-cell.on{transform:none}

  /* --- tooltips become a pinned bottom hint bar (can't overflow anything) --- */
  .tt::after{
    position:fixed; left:10px; right:auto; bottom:14px; top:auto;
    width:calc(100vw - 20px); transform:none; z-index:300; font-size:.83rem;
  }
  .tt:hover::after,.tt:active::after,.tt:focus::after{content:attr(data-tip)}

  /* --- toasts: shrink-to-fit, capped (left+right together resolved to full width) --- */
  #toasts{left:10px; right:auto; top:64px; width:auto; max-width:calc(100vw - 20px)}
  .toast{max-width:100%; font-size:.83rem}
}
@media (max-width:340px){
  .tiles{grid-template-columns:minmax(0,1fr)}
  .hud-name{max-width:32vw}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
</style>

<div class="wrap" id="app"></div>
<div id="toasts"></div>

<script id="engine">
"use strict";
/* ---------- seeded RNG ---------- */
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}

const MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
const SEASON=[0.92,0.90,0.96,1.00,1.00,1.02,1.00,1.12,1.18,1.02,1.38,1.68];
const START_CASH=30000;
const LUCK_RANGE=0.10;               /* ±10% random variation, disclosed up front */

/* ---------- competitive advantage archetypes ---------- */
const ARCHETYPES={
  lowcost:{
    key:"lowcost", icon:"🎧", name:"Low-cost operator",
    blurb:"Refurbished & off-brand goods, bare-bones fixtures, cheap lease, lean staffing. Win by having the lowest costs in town.",
    unitCost:25, basePrice:33, unitLabel:"item",
    baseDemand:450, staffCap:650, staffCapTrained:720,
    startStaff:1, staffCost:1150, trainedCost:1350,
    rent:1000, utilities:180,
    defectRate:0.02, seasonSens:0.55, repSens:0.5,
    mkt:{social:0.15, local:0.18, influencer:0.10, sale:0.45},
    priceMults:{undercut:{p:0.92,d:1.30}, match:{p:1,d:1}, premium:{p:1.10,d:0.60}},
    startup:{license:500, deposit:1500, fixtures:1400, pos:800, initUnits:380},
    marginNote:"~15–20% (thin!)", volumeNote:"high — hundreds of items/mo", overheadNote:"low",
    riskNote:"Thin margins + product returns. Profit comes from volume and ruthless cost control.",
    catNames:["Phone repair parts","Prepaid SIM & top-ups"],
    serviceName:"Phone repair counter",
    goodScore:50000, greatScore:80000,
  },
  premium:{
    key:"premium", icon:"🖥️", name:"Premium experience",
    blurb:"Flagship brands, trained experts, showroom-quality store, prime location. Win by being worth paying more for.",
    unitCost:1150, basePrice:2050, unitLabel:"unit",
    baseDemand:5.2, staffCap:5, staffCapTrained:7,
    startStaff:1, staffCost:1500, trainedCost:1800,
    rent:2000, utilities:300,
    defectRate:0.01, seasonSens:1.15, repSens:1.2,
    mkt:{social:0.10, local:0.12, influencer:0.25, sale:0.05},
    priceMults:{undercut:{p:0.90,d:1.10}, match:{p:1,d:1}, premium:{p:1.06,d:0.90}},
    startup:{license:800, deposit:3600, fixtures:4200, pos:1500, initUnits:7},
    marginNote:"~35–45% (fat)", volumeNote:"low — a handful of units/mo", overheadNote:"high",
    riskNote:"Each unit ties up $1,150 of cash. One slow month hurts. Reputation and trained staff drive demand.",
    catNames:["Premium audio","Smart-home installs"],
    serviceName:"White-glove install & warranty desk",
    goodScore:45000, greatScore:75000,
  },
};
/* ---------- market scope ---------- */
const NICHES={
  gaming:{icon:"🎮", name:"Gaming", catNames:["Retro consoles","PC components"], serviceName:"Console repair & mod bench"},
  audio:{icon:"🔊", name:"Home audio", catNames:["Vinyl & turntables","Acoustic treatment"], serviceName:"Room-tuning & install service"},
  mobile:{icon:"📱", name:"Mobile & repair", catNames:["Cases & accessories","Trade-in program"], serviceName:"Same-day repair counter"},
  smarthome:{icon:"🏠", name:"Smart home", catNames:["Security cameras","Smart lighting"], serviceName:"Whole-home install service"},
};
const SCOPE={
  broad:{demandScale:1.0, rentScale:1.0, repGain:1.0, bigboxMult:0.85, depositScale:1.0,
    note:"Bigger demand pool; full exposure to competition events."},
  niche:{demandScale:0.75, rentScale:0.85, repGain:1.5, bigboxMult:0.93, depositScale:0.88,
    note:"Smaller pool, but loyal fans, faster reputation growth, and partial protection from big-box competitors."},
};
function porterName(advantage,scope){
  return advantage==="lowcost"?(scope==="broad"?"Cost Leadership":"Cost Focus")
                              :(scope==="broad"?"Differentiation":"Differentiation Focus");
}
function porterDesc(advantage,scope){
  const how=advantage==="lowcost"?"win by having the lowest costs":"win by offering an experience worth paying more for";
  const who=scope==="broad"?"across the whole market":"inside a niche you serve better than anyone";
  return "You "+how+", "+who+".";
}

const MARKETING={
  none:{name:"No marketing", cost:0},
  social:{name:"Social media ads", cost:450, desc:"Cheap reach."},
  local:{name:"Local ads (radio/flyers)", cost:650, desc:"Reliable local traffic."},
  influencer:{name:"Influencer unboxing", cost:1300, desc:"Moves premium product."},
  sale:{name:"Sale event weekend", cost:800, desc:"Huge for low-cost volume."},
};
const IMPROVEMENTS={
  displays:{name:"Better displays", cost:900, desc:"+5% demand permanently."},
  demo:{name:"Demo stations", cost:1400, desc:"Let customers try products. +8% demand (+12% premium)."},
  security:{name:"Security upgrade", cost:1200, desc:"Cuts shrinkage (theft/loss) from 2% to 0.5% of stock monthly; blunts theft events."},
};
const INSURANCE_COST=180;
const SECURITY_BASE=100;
const SERVICE_LAUNCH=1500;
const HIRE_FEE=400, TRAIN_COST=600, SEVERANCE=300;
const CAT_COST=800;
const LOAN_STEP=5000, LOAN_MAX=15000, LOAN_APR=0.08, LOAN_MONTHS=12;
const LOAN_MR=LOAN_APR/12;
const FAM_STEP=2500, FAM_MAX=10000, FAM_RISK=0.12;
const CROWD_COST=500;
const INVESTOR_CASH=8000, INVESTOR_EQUITY=0.15;

function loanMonthlyFor(balance){
  return Math.ceil(balance*LOAN_MR/(1-Math.pow(1+LOAN_MR,-LOAN_MONTHS)));
}

function createGame(teamName,storeName,advantage,scope,nicheType,pricing){
  const a=ARCHETYPES[advantage], sc=SCOPE[scope];
  const seed=hashStr(teamName+"|"+storeName+"|"+advantage+"|"+scope+"|"+(nicheType||""));
  const st={
    teamName, storeName, advantage, scope, nicheType:scope==="niche"?nicheType:null, pricing,
    seed, _rng:mulberry32(seed),
    month:0, phase:"decide", gameOver:false, bankrupt:false,
    cash:START_CASH,
    units:0, invCost:a.unitCost,
    staff:a.startStaff, trained:0,
    rep:50,
    coherence:100, cohBonus:0, cohHistory:[], cohLog:[], monthIncoherent:false,
    bank:{balance:0, payment:0, borrowed:0},
    fam:{balance:0, lastBorrowMonth:-9, planRemaining:0, planMonthly:0},
    equity:0,
    insurance:false, security:false, displays:false, demo:false,
    services:false, serviceLevel:0, cats:0,
    marketing:"none",
    costHike:0, nextDemandBonus:0, discountStock:false, competitor:false,
    crowdUsed:false, crowdPending:0,
    investorRounds:0, investorLastFail:-9,
    bulkOffer:null, bulkPending:null,
    liquidatedThisMonth:false,
    priceChangeMonths:[],
    lastEventNeg:false, lastEventId:null, firedOnce:{},
    monthSpend:{}, minCash:START_CASH,
    history:[], log:[], startupBill:null, famEmergency:null,
  };
  /* startup purchases — scope adjusts deposit/inventory sizing */
  const su=a.startup;
  const initUnits=Math.round(su.initUnits*(scope==="niche"?0.78:1));
  const deposit=Math.round(su.deposit*sc.depositScale/50)*50;
  st.units=initUnits;
  const inv=initUnits*a.unitCost;
  const bill=[["Business license & permits",su.license],["Store lease deposit"+(advantage==="premium"?" (prime location)":""),deposit],
    ["Shelving, fixtures & security"+(advantage==="premium"?" (showroom grade)":""),su.fixtures],["Point-of-sale system",su.pos],
    ["Initial inventory ("+initUnits+" "+a.unitLabel+"s)",inv]];
  const total=bill.reduce((x,b)=>x+b[1],0);
  st.cash-=total;
  st.startupBill={items:bill,total};
  st.log.push({m:0,txt:"Opened "+storeName+" — "+porterName(advantage,scope)+(st.nicheType?" ("+NICHES[st.nicheType].name+" niche)":"")+". Startup costs $"+total.toLocaleString()+"."});
  st.minCash=Math.min(st.minCash,st.cash);
  return st;
}

function arch(st){return ARCHETYPES[st.advantage];}
function scopeOf(st){return SCOPE[st.scope];}
function catNames(st){return st.nicheType?NICHES[st.nicheType].catNames:arch(st).catNames;}
function serviceName(st){return st.nicheType?NICHES[st.nicheType].serviceName:arch(st).serviceName;}
function rng(st){return st._rng();}
function repUp(st,amt){st.rep=Math.min(95,st.rep+amt*scopeOf(st).repGain);return amt*scopeOf(st).repGain;}
function repDown(st,amt){st.rep=Math.max(5,st.rep-amt);}

function price(st){
  const a=arch(st);
  let p=a.basePrice*a.priceMults[st.pricing].p;
  if(st.discountStock) p*=0.88;
  return p;
}
function staffCapacity(st){
  const a=arch(st);
  return (st.staff-st.trained)*a.staffCap + st.trained*a.staffCapTrained;
}
function rentOf(st){return Math.round(arch(st).rent*scopeOf(st).rentScale/10)*10;}
function burnRate(st){
  const a=arch(st);
  let b=rentOf(st)+a.utilities+SECURITY_BASE;
  b+=(st.staff-st.trained)*a.staffCost + st.trained*a.trainedCost;
  if(st.insurance)b+=INSURANCE_COST;
  b+=Math.min(st.bank.balance>0?st.bank.payment:0, st.bank.balance+Math.round(st.bank.balance*LOAN_MR));
  b+=Math.min(st.fam.planRemaining, st.fam.planMonthly);
  return Math.round(b);
}
function inventoryValue(st){return Math.round(st.units*st.invCost);}
function effUnitCost(st){return Math.round(arch(st).unitCost*(st.costHike>0?1.10:1));}
function seasonMult(st,m){return 1+(SEASON[m]-1)*arch(st).seasonSens;}
function totalDebt(st){return Math.round(st.bank.balance+st.fam.balance);}
function seasonLabel(m){
  if(m===10||m===11)return"🎄 HOLIDAY SURGE — biggest demand of the year!";
  if(m===7||m===8)return"🎒 Back-to-school bump";
  if(m===9)return"🎄 Holiday season starts next month — stock up NOW!";
  if(m===6)return"Back-to-school bump starts next month";
  if(m===0||m===1)return"❄️ Post-holiday slump — demand is soft";
  return"Normal season";
}

/* ---------- strategy coherence ---------- */
function clarityOf(coh){return coh>=80?"strong":coh>=50?"wobble":"stuck";}
function clarityLabel(coh){return coh>=80?"Strong":coh>=50?"Wobbling":"Stuck in the middle";}
function addIncoherence(st,pts,why){
  st.coherence=Math.max(0,st.coherence-pts);
  st.monthIncoherent=true;
  st.cohLog.push({m:st.month,why,pts});
  return "⚠️ Off-strategy: "+why+" (clarity −"+pts+")";
}
function coherenceDemandFactor(st){
  return clarityOf(st.coherence)==="stuck"?0.90:1+st.cohBonus/100;
}
function isOffStrategy(st,what){ /* used by UI to label options before purchase */
  if(st.advantage==="lowcost")return what==="influencer"||what==="demo"||what==="premiumPricing";
  return what==="sale"||what==="undercutPricing"||what==="liquidate";
}

/* ---------- demand stack (single source of truth for projection AND results) ---------- */
function demandStack(st,luck){
  const a=arch(st);
  const items=[];
  const base=Math.round(a.baseDemand*scopeOf(st).demandScale*(1+0.10*st.cats));
  items.push({label:"Base demand"+(st.cats?" (incl. "+st.cats+" extra product line"+(st.cats>1?"s":"")+")":"")+(st.scope==="niche"?" — "+NICHES[st.nicheType].name+" niche":""),
    kind:"base", value:base});
  let d=base;
  function f(label,mult){
    if(Math.abs(mult-1)<0.0005)return;
    items.push({label,kind:"pct",pct:Math.round((mult-1)*100)});
    d*=mult;
  }
  f("Seasonality ("+MONTH_NAMES[st.month]+")",seasonMult(st,st.month));
  f("Pricing: "+st.pricing,a.priceMults[st.pricing].d);
  if(st.marketing!=="none")f(MARKETING[st.marketing].name,1+a.mkt[st.marketing]);
  f("Reputation ("+Math.round(st.rep)+"/100)",Math.max(0.3,1+(st.rep-50)/100*a.repSens));
  const impf=1+(st.displays?0.05:0)+(st.demo?(st.advantage==="premium"?0.12:0.08):0);
  f("Store upgrades",impf);
  if(st.nextDemandBonus)f("Event traffic",1+st.nextDemandBonus);
  if(st.competitor)f("Big-box competitor"+(st.scope==="niche"?" (niche protection)":""),scopeOf(st).bigboxMult);
  const coh=coherenceDemandFactor(st);
  if(clarityOf(st.coherence)==="stuck")
    items.push({label:"Customers are confused about what your store stands for",kind:"pct",pct:-10}),d*=0.90;
  else if(st.cohBonus>0)
    items.push({label:"Strategy clarity — customers know what you stand for",kind:"pct",pct:st.cohBonus}),d*=coh;
  if(luck!==null&&luck!==undefined){
    items.push({label:"Random variation this month",kind:"pct",pct:Math.round((luck-1)*100)});
    d*=luck;
  }
  return {items, demand:Math.round(d),
    low:Math.round(d*(1-LUCK_RANGE)), high:Math.round(d*(1+LUCK_RANGE))};
}
function projectedServiceRev(st){
  return st.services?Math.round(st.serviceLevel*(0.7+st.rep/100*0.6)):0;
}
function projectRevenue(st){
  const stk=demandStack(st,null);
  const cap=Math.round(staffCapacity(st));
  const p=price(st);
  const a=arch(st);
  const soldLow=Math.min(stk.low,st.units,cap), soldHigh=Math.min(stk.high,st.units,cap);
  const revLow=Math.round(soldLow*p*(1-a.defectRate))+projectedServiceRev(st);
  const revHigh=Math.round(soldHigh*p*(1-a.defectRate))+projectedServiceRev(st);
  let binding=null;
  if(st.units<stk.low)binding="inventory";
  else if(cap<stk.low)binding="staff";
  else if(st.units<stk.high)binding="inventory-high";
  else if(cap<stk.high)binding="staff-high";
  return {stack:stk, cap, price:Math.round(p), soldLow, soldHigh, revLow, revHigh, binding};
}

/* ---------- month start: recurring bills ---------- */
function startMonth(st){
  const a=arch(st), lines=[];
  st.phase="decide"; st.marketing="none"; st.liquidatedThisMonth=false;
  st.monthSpend={}; st.monthIncoherent=false; st.famEmergency=null;
  lines.push(["Rent",rentOf(st)],["Payroll ("+st.staff+" staff)",(st.staff-st.trained)*a.staffCost+st.trained*a.trainedCost],
    ["Utilities",a.utilities],["Security system",SECURITY_BASE]);
  if(st.insurance)lines.push(["Insurance premium",INSURANCE_COST]);
  if(st.bank.balance>0){
    const interest=Math.round(st.bank.balance*LOAN_MR);
    const pay=Math.min(st.bank.balance+interest,st.bank.payment);
    st.bank.balance=Math.max(0,st.bank.balance+interest-pay);
    if(st.bank.balance<1){st.bank.balance=0;st.bank.payment=0;}
    lines.push(["Bank loan payment (incl. $"+interest+" interest)",pay]);
  }
  if(st.fam.planRemaining>0){
    const pay=Math.min(st.fam.planRemaining,st.fam.planMonthly);
    st.fam.planRemaining-=pay;st.fam.balance=Math.max(0,st.fam.balance-pay);
    lines.push(["Family payment plan",pay]);
  }
  const total=lines.reduce((x,b)=>x+b[1],0);
  st.cash-=total;
  st.recurring={lines,total};
  if(st.crowdPending>0){
    st.cash+=st.crowdPending;
    st.log.push({m:st.month,txt:"Crowdfunding paid out $"+st.crowdPending.toLocaleString()+"."});
    st.crowdCollected=st.crowdPending; st.crowdPending=0;
  } else st.crowdCollected=0;
  if(st.bulkPending){
    st.cash+=st.bulkPending.payout;
    st.log.push({m:st.month,txt:"Corporate bulk order delivered: +$"+st.bulkPending.payout.toLocaleString()+"."});
    st.bulkPaid=st.bulkPending.payout; st.bulkPending=null;
  } else st.bulkPaid=0;
  /* family emergency — never in the borrow month, never in the first 3 months */
  if(st.fam.balance>0&&st.fam.planRemaining<=0&&st.month>=3&&st.month!==st.fam.lastBorrowMonth){
    if(rng(st)<FAM_RISK){
      const need=Math.round(st.fam.balance*0.25);
      if(st.cash>need+1){
        st.cash-=need;st.fam.balance-=need;
        st.famEmergency={paid:true,amount:need,
          txt:"Family emergency! They needed 25% of their money back — you paid $"+need.toLocaleString()+" on the spot."};
      }else{
        repDown(st,5);
        st.fam.planRemaining=need;st.fam.planMonthly=Math.ceil(need/4);
        st.famEmergency={paid:false,amount:need,
          txt:"Family emergency! They needed $"+need.toLocaleString()+" back NOW and you couldn't pay. Word got around (reputation −5) and you're forced onto a payment plan of $"+st.fam.planMonthly.toLocaleString()+"/mo until it's covered."};
      }
      st.log.push({m:st.month,txt:"EVENT — "+st.famEmergency.txt});
    }
  }
  st.minCash=Math.min(st.minCash,st.cash);
  if(st.cash<=0){bankrupt(st,"Monthly bills of $"+total.toLocaleString()+" drained the last of the cash.");}
  return {lines,total};
}

/* ---------- decision actions (all return {ok,msg}) ---------- */
function spend(st,amount,label,cat){
  if(st.gameOver)return{ok:false,msg:"Game over."};
  if(amount>st.cash)return{ok:false,msg:"Not enough cash — that costs $"+amount.toLocaleString()+" and you have $"+Math.round(st.cash).toLocaleString()+"."};
  st.cash-=amount;
  st.monthSpend[cat]=(st.monthSpend[cat]||0)+amount;
  st.log.push({m:st.month,txt:label+" (−$"+amount.toLocaleString()+")"});
  st.minCash=Math.min(st.minCash,st.cash);
  if(st.cash<=0){bankrupt(st,label+" spent the last of the cash.");}
  return{ok:true};
}
function orderInventory(st,units){
  units=Math.max(0,Math.round(units));
  if(units===0)return{ok:false,msg:"Enter a quantity first."};
  const uc=effUnitCost(st), cost=units*uc;
  const r=spend(st,cost,"Ordered "+units+" "+arch(st).unitLabel+"s @ $"+uc,"inventory");
  if(!r.ok)return r;
  st.invCost=(st.invCost*st.units+uc*units)/(st.units+units);
  st.units+=units;
  return{ok:true,msg:"Stock arrived: +"+units};
}
function setMarketing(st,id){
  if(id===st.marketing)return{ok:true};
  if(st.marketing!=="none")return{ok:false,msg:"You already booked "+MARKETING[st.marketing].name+" this month."};
  const mk=MARKETING[id];
  const r=spend(st,mk.cost,"Booked "+mk.name,"marketing");
  if(!r.ok)return r;
  st.marketing=id;
  let note=null;
  if(st.advantage==="lowcost"&&id==="influencer")
    note=addIncoherence(st,12,"influencer campaigns clash with your no-frills positioning");
  if(st.advantage==="premium"&&id==="sale"){
    repDown(st,3);
    note=addIncoherence(st,12,"discount weekends cheapen your premium brand (also −3 reputation)");
  }
  return{ok:true,msg:note};
}
function hireStaff(st){
  const r=spend(st,HIRE_FEE,"Hired a new employee","staffing");
  if(!r.ok)return r;
  st.staff++;return{ok:true};
}
function trainStaff(st){
  if(st.trained>=st.staff)return{ok:false,msg:"Everyone is already trained."};
  const r=spend(st,TRAIN_COST,"Sent an employee to product training","staffing");
  if(!r.ok)return r;
  st.trained++;return{ok:true};
}
function layoffStaff(st){
  if(st.staff<=1)return{ok:false,msg:"You need at least one employee to run the register."};
  const r=spend(st,SEVERANCE,"Laid off an employee (severance)","staffing");
  if(!r.ok)return r;
  st.staff--; if(st.trained>st.staff)st.trained=st.staff;
  repDown(st,1);
  return{ok:true};
}
function buyImprovement(st,id){
  if(st[id])return{ok:false,msg:"Already installed."};
  const im=IMPROVEMENTS[id];
  const r=spend(st,im.cost,"Installed "+im.name.toLowerCase(),"improvements");
  if(!r.ok)return r;
  st[id]=true;
  let note=null;
  if(id==="demo"&&st.advantage==="lowcost")
    note=addIncoherence(st,10,"fancy demo stations confuse bargain hunters");
  return{ok:true,msg:note};
}
function launchServices(st){
  if(st.services)return{ok:false,msg:"Already running."};
  const r=spend(st,SERVICE_LAUNCH,"Launched "+serviceName(st).toLowerCase(),"services");
  if(!r.ok)return r;
  st.services=true;st.serviceLevel=500;return{ok:true};
}
function addCategory(st){
  if(st.cats>=2)return{ok:false,msg:"You already carry both adjacent categories."};
  const name=catNames(st)[st.cats];
  const r=spend(st,CAT_COST,"Added product line: "+name,"inventory");
  if(!r.ok)return r;
  st.cats++;return{ok:true,msg:name+" added — +10% base demand."};
}
function setInsurance(st,on){
  if(on===st.insurance)return{ok:true};
  st.insurance=on;
  st.log.push({m:st.month,txt:on?"Bought business insurance ($"+INSURANCE_COST+"/mo).":"Cancelled insurance."});
  return{ok:true};
}
function setPricing(st,p){
  if(p===st.pricing)return{ok:true};
  st.pricing=p;
  st.log.push({m:st.month,txt:"Pricing strategy → "+p+"."});
  let note=null;
  st.priceChangeMonths.push(st.month);
  const recent=st.priceChangeMonths.filter(m=>st.month-m<3).length;
  if(recent>=2)note=addIncoherence(st,5,"price flip-flopping confuses customers");
  if(st.advantage==="premium"&&p==="undercut"){
    repDown(st,4);
    note=addIncoherence(st,8,"slashing prices damages a premium brand (also −4 reputation)");
  }
  return{ok:true,msg:note};
}
/* ---------- fundraising ---------- */
function takeLoan(st){
  if(st.bank.borrowed+LOAN_STEP>LOAN_MAX)return{ok:false,msg:"The bank won't lend beyond $"+LOAN_MAX.toLocaleString()+" total."};
  st.bank.borrowed+=LOAN_STEP;st.bank.balance+=LOAN_STEP;st.cash+=LOAN_STEP;
  st.bank.payment=loanMonthlyFor(st.bank.balance);
  st.log.push({m:st.month,txt:"Took a $"+LOAN_STEP.toLocaleString()+" bank loan — new payment $"+st.bank.payment.toLocaleString()+"/mo (8% APR, 12 months)."});
  return{ok:true,msg:"+$5,000 cash. Payments of $"+st.bank.payment.toLocaleString()+"/mo start next month."};
}
function payOffLoan(st){
  if(st.bank.balance<=0)return{ok:false,msg:"No bank balance to pay off."};
  const owed=Math.round(st.bank.balance);
  if(owed>st.cash)return{ok:false,msg:"Paying off the loan costs $"+owed.toLocaleString()+" — you have $"+Math.round(st.cash).toLocaleString()+"."};
  st.cash-=owed;st.bank.balance=0;st.bank.payment=0;
  st.log.push({m:st.month,txt:"Paid off the bank loan early (−$"+owed.toLocaleString()+")."});
  st.minCash=Math.min(st.minCash,st.cash);
  return{ok:true,msg:"Loan cleared — no more monthly payments."};
}
function borrowFamily(st){
  if(st.fam.balance+FAM_STEP>FAM_MAX)return{ok:false,msg:"Family & friends can lend at most $"+FAM_MAX.toLocaleString()+" outstanding."};
  st.fam.balance+=FAM_STEP;st.cash+=FAM_STEP;st.fam.lastBorrowMonth=st.month;
  st.log.push({m:st.month,txt:"Borrowed $"+FAM_STEP.toLocaleString()+" from family & friends (0% interest, repay on demand)."});
  return{ok:true,msg:"+$2,500 at 0% — but while you owe them, they might need it back suddenly."};
}
function repayFamily(st,all){
  if(st.fam.balance<=0)return{ok:false,msg:"You don't owe family anything."};
  const amt=all?Math.round(st.fam.balance):Math.min(FAM_STEP,Math.round(st.fam.balance));
  if(amt>st.cash)return{ok:false,msg:"That repayment costs $"+amt.toLocaleString()+" — you have $"+Math.round(st.cash).toLocaleString()+"."};
  st.cash-=amt;st.fam.balance-=amt;
  if(st.fam.balance<=st.fam.planRemaining){st.fam.planRemaining=Math.max(0,Math.round(st.fam.balance));if(st.fam.planRemaining===0)st.fam.planMonthly=0;}
  st.log.push({m:st.month,txt:"Repaid family & friends $"+amt.toLocaleString()+"."});
  st.minCash=Math.min(st.minCash,st.cash);
  return{ok:true,msg:"Repaid $"+amt.toLocaleString()+" — that money no longer carries emergency risk."};
}
function investorQuestions(st){
  const a=arch(st);
  const burn=burnRate(st);
  const margin=Math.round((1-a.unitCost/price(st))*100);
  const runway=Math.max(0,Math.floor(st.cash/Math.max(1,burn)));
  function opts(correct,fmt){
    const set=[correct,Math.round(correct*0.6),Math.round(correct*1.5)];
    const r=mulberry32(st.seed+st.month*7)();
    if(r>0.66)set.push(set.shift());else if(r>0.33)set.unshift(set.pop());
    return set.map(v=>({v,label:fmt(v),correct:v===correct}));
  }
  return[
    {q:"What is your monthly burn rate (recurring costs)?",opts:opts(burn,v=>"$"+v.toLocaleString())},
    {q:"What is your gross margin per sale right now?",opts:opts(margin,v=>v+"%")},
    {q:"At current burn, how many months of runway does your cash cover?",opts:opts(Math.max(1,runway),v=>v+" month"+(v===1?"":"s"))},
  ];
}
function pitchInvestor(st,correctCount){
  if(st.investorRounds>=2)return{ok:false,msg:"Investors are tapped out (max 2 rounds)."};
  if(st.month-st.investorLastFail<2)return{ok:false,msg:"Investors want to see progress — try again in a month or two."};
  if(correctCount>=2){
    st.cash+=INVESTOR_CASH;st.equity+=INVESTOR_EQUITY;st.investorRounds++;
    st.log.push({m:st.month,txt:"Investor pitch succeeded: +$"+INVESTOR_CASH.toLocaleString()+" for "+(INVESTOR_EQUITY*100)+"% equity."});
    return{ok:true,success:true,msg:"They're in! +$"+INVESTOR_CASH.toLocaleString()+" for 15% of the company."};
  }
  st.investorLastFail=st.month;
  st.log.push({m:st.month,txt:"Investor pitch failed — you didn't know your own numbers."});
  return{ok:true,success:false,msg:"They passed. Know your numbers and try again later."};
}
function runCrowdfunding(st){
  if(st.crowdUsed)return{ok:false,msg:"You already ran your one campaign."};
  const r=spend(st,CROWD_COST,"Launched crowdfunding campaign","fundraising");
  if(!r.ok)return r;
  st.crowdUsed=true;
  const roll=rng(st);
  st.crowdPending=Math.round((500+roll*3800)*(0.5+st.rep/100));
  return{ok:true,msg:"Campaign live — backers pay out at the start of next month."};
}
function liquidate(st){
  if(st.liquidatedThisMonth)return{ok:false,msg:"You already ran a lot sale this month."};
  const sell=Math.floor(st.units*0.3);
  if(sell<1)return{ok:false,msg:"Not enough stock to liquidate."};
  const cashIn=Math.round(sell*st.invCost*0.7);
  st.units-=sell;st.cash+=cashIn;st.liquidatedThisMonth=true;
  repDown(st,1);
  let note=null;
  if(st.advantage==="premium")note=addIncoherence(st,5,"parking-lot fire sales look desperate for a premium store");
  st.log.push({m:st.month,txt:"Parking-lot liquidation: sold "+sell+" units below cost for $"+cashIn.toLocaleString()+" (−1 rep)."});
  return{ok:true,msg:"+$"+cashIn.toLocaleString()+" cash, −"+sell+" units (sold below cost)."+(note?" "+note:"")};
}
function acceptBulkOrder(st){
  const o=st.bulkOffer;
  if(!o)return{ok:false,msg:"No offer on the table."};
  const cost=o.units*effUnitCost(st);
  const r=spend(st,cost,"Bought "+o.units+" units for the corporate bulk order","inventory");
  if(!r.ok)return r;
  st.bulkPending={payout:o.payout};
  st.bulkOffer=null;
  return{ok:true,msg:"Deal! $"+o.payout.toLocaleString()+" lands at the start of next month."};
}
function declineBulkOrder(st){st.bulkOffer=null;return{ok:true};}

/* ---------- month end: revenue + event ---------- */
function endMonth(st){
  if(st.gameOver)return null;
  const a=arch(st);
  const m=st.month;
  /* recurring incoherence from standing pricing choices */
  if(st.advantage==="lowcost"&&st.pricing==="premium")
    addIncoherence(st,6,"premium prices on off-brand goods");
  if(st.advantage==="premium"&&st.pricing==="undercut")
    addIncoherence(st,6,"running a premium showroom at discount prices");
  /* demand — same stack players saw, plus the random roll */
  const luck=1-LUCK_RANGE+rng(st)*2*LUCK_RANGE;
  const stk=demandStack(st,luck);
  const demand=stk.demand;
  const cap=Math.round(staffCapacity(st));
  const sold=Math.min(demand,st.units,cap);
  const p=price(st);
  const revenue=Math.round(sold*p);
  const returns=Math.round(revenue*a.defectRate);
  let serviceRev=0;
  if(st.services){
    serviceRev=Math.round(st.serviceLevel*(0.7+st.rep/100*0.6));
    st.serviceLevel=Math.min(1100,st.serviceLevel+75);
  }
  const cogs=Math.round(sold*st.invCost);
  st.units-=sold;
  const shrinkPct=st.security?0.005:0.02;
  const shrunk=Math.floor(st.units*shrinkPct + (rng(st)<(st.units*shrinkPct%1)?1:0));
  const shrinkCost=Math.round(shrunk*st.invCost);
  st.units-=shrunk;
  st.cash+=revenue-returns+serviceRev;
  /* reputation drift */
  let repNotes=[];
  if(demand>0&&sold<demand*0.8){const hit=st.advantage==="lowcost"?1:2;repDown(st,hit);repNotes.push("Customers left empty-handed (stockout) −"+hit);}
  if(st.advantage==="lowcost"){repDown(st,0.3);repNotes.push("Cheap-product returns −0.3");}
  if(st.trained>0){const g=(st.advantage==="premium"?1.0:0.8)*Math.min(st.trained,2);const got=repUp(st,g);repNotes.push("Trained staff +"+got.toFixed(1));}
  if(st.services){const got=repUp(st,0.5);repNotes.push("Service desk +"+got.toFixed(1));}
  if(st.advantage==="premium"&&st.pricing==="premium"){const got=repUp(st,0.5);repNotes.push("Premium positioning +"+got.toFixed(1));}
  st.rep=Math.max(5,Math.min(95,st.rep));
  /* coherence recovery + clarity bonus */
  if(!st.monthIncoherent)st.coherence=Math.min(100,st.coherence+5);
  const clarity=clarityOf(st.coherence);
  if(clarity==="strong")st.cohBonus=Math.min(10,st.cohBonus+1);
  else if(clarity==="wobble")st.cohBonus=Math.max(0,st.cohBonus-2);
  else st.cohBonus=Math.max(0,st.cohBonus-4);
  st.cohHistory.push({m,coherence:Math.round(st.coherence),clarity});
  /* clear one-month modifiers */
  st.nextDemandBonus=0;
  const wasDiscounted=st.discountStock;st.discountStock=false;
  if(st.costHike>0)st.costHike--;
  /* P&L */
  const spent=st.monthSpend;
  const opEx=(st.recurring?st.recurring.total:0)
    +(spent.marketing||0)+(spent.staffing||0)+(spent.improvements||0)
    +(spent.services||0)+(spent.fundraising||0);
  const profit=revenue-returns+serviceRev-cogs-opEx-shrinkCost;
  const report={
    month:m, demand, sold, cap, unitsLeft:st.units, price:Math.round(p),
    revenue, returns, serviceRev, cogs, shrinkCost, shrunk,
    opEx, profit, stack:stk, luck, wasDiscounted, repNotes, event:null,
  };
  report.event=maybeEvent(st);
  st.minCash=Math.min(st.minCash,st.cash);
  st.history.push({m,revenue:revenue-returns+serviceRev,cogs:cogs+shrinkCost,opEx,profit,cashEnd:Math.round(st.cash),
    invValue:inventoryValue(st),sold,demand,rep:Math.round(st.rep),coherence:Math.round(st.coherence)});
  if(st.cash<=0&&!st.gameOver){bankrupt(st,"Month-end losses wiped out the cash.");}
  else if(m===11){st.gameOver=true;st.phase="won";}
  else{st.month++;st.phase="bills";}
  return report;
}

/* ---------- next-month preview (shown on the results screen) ---------- */
function nextMonthPreview(st,justResolved){
  if(st.gameOver)return null;
  const m=st.month; /* already advanced */
  const items=[];
  const sNow=seasonMult(st,justResolved.month), sNext=seasonMult(st,m);
  const delta=Math.round((sNext/sNow-1)*100);
  if(delta!==0)items.push((delta>0?"📈 ":"📉 ")+MONTH_NAMES[m]+" seasonality: "+(delta>0?"+":"")+delta+"% demand vs this month"+((m===10||m===11)?" — holiday surge!":""));
  else items.push("Seasonality steady in "+MONTH_NAMES[m]+".");
  if(justResolved.stack.items.some(i=>/ads|unboxing|Sale event/i.test(i.label))){
    const mk=justResolved.stack.items.find(i=>/ads|unboxing|Sale event/i.test(i.label));
    items.push("⏳ "+mk.label+" boost ends: −"+mk.pct+"% next month unless you book again.");
  }
  if(st.nextDemandBonus>0)items.push("🎉 Incoming event traffic: +"+Math.round(st.nextDemandBonus*100)+"% next month.");
  if(st.discountStock)items.push("🏷️ Your current stock sells at a 12% discount next month (last-gen models).");
  if(st.costHike>0)items.push("📈 Supplier prices stay +10% for "+st.costHike+" more month"+(st.costHike>1?"s":"")+".");
  if(st.bank.balance>0)items.push("🏦 Bank payment due: $"+Math.min(st.bank.balance+Math.round(st.bank.balance*LOAN_MR),st.bank.payment).toLocaleString()+" (balance $"+Math.round(st.bank.balance).toLocaleString()+").");
  if(st.fam.planRemaining>0)items.push("👪 Family payment plan: $"+Math.min(st.fam.planRemaining,st.fam.planMonthly).toLocaleString()+"/mo until $"+st.fam.planRemaining.toLocaleString()+" is covered.");
  else if(st.fam.balance>0)items.push("👪 You owe family $"+Math.round(st.fam.balance).toLocaleString()+" — each month there's a small chance they need 25% back on the spot.");
  items.push("💸 Recurring bills next month: ~$"+burnRate(st).toLocaleString()+".");
  return items;
}

/* ---------- events ---------- */
const EVENTS=[
  {id:"release",w:3,neg:false,kind:"mixed",title:"📦 Major new model release!",
   can:st=>st.units>0,
   apply(st){st.discountStock=true;st.nextDemandBonus+=0.25;
     return"A hot new flagship just launched. Your current stock is last-gen — next month it sells at a 12% discount, but launch hype brings +25% foot traffic.";}},
  {id:"theft",w:2,neg:true,kind:"bad",title:"🚨 Shoplifting incident",
   can:st=>st.units>2,
   apply(st){const pct=st.security?0.02:0.10;const lost=Math.max(1,Math.floor(st.units*pct));
     st.units-=lost;const val=Math.round(lost*st.invCost);let txt="Thieves hit the store overnight: "+lost+" units gone ($"+val.toLocaleString()+" of stock).";
     if(st.security)txt+=" Your security upgrade kept the damage small.";
     if(st.insurance){const back=Math.round(val*0.8);st.cash+=back;txt+=" Insurance reimbursed $"+back.toLocaleString()+".";}
     return txt;}},
  {id:"recall",w:2,neg:true,kind:"bad",title:"⚠️ Product recall",
   can:st=>st.units>3,
   apply(st){const lost=Math.max(1,Math.floor(st.units*0.06));st.units-=lost;
     const val=Math.round(lost*st.invCost);
     repDown(st,st.insurance?2:4);
     let txt="A supplier recalled an item you stock. "+lost+" units pulled from shelves ($"+val.toLocaleString()+"). Reputation −"+(st.insurance?2:4)+".";
     if(st.insurance){const back=Math.round(val*0.6);st.cash+=back;txt+=" Insurance covered $"+back.toLocaleString()+".";}
     return txt;}},
  {id:"hike",w:2,neg:true,kind:"bad",title:"📈 Supplier price hike",
   can:st=>true,
   apply(st){st.costHike=2;return"A component shortage pushed wholesale prices up 10% for the next 2 months. Restocking just got expensive.";}},
  {id:"bigbox",w:1.5,neg:true,kind:"bad",title:"🏬 Big-box competitor opens nearby",
   can:st=>!st.competitor&&st.month>=4,once:true,
   apply(st){st.competitor=true;
     const hit=Math.round((1-scopeOf(st).bigboxMult)*100);
     return"A national chain opened two blocks away. Demand drops "+hit+"% for the rest of the year"+
       (st.scope==="niche"?" — your loyal niche following blunts most of the damage.":" — differentiate or die.");}},
  {id:"viral",w:2,neg:false,kind:"good",title:"🌟 Viral review!",
   can:st=>true,
   apply(st){const got=repUp(st,6);st.nextDemandBonus+=0.25;
     return"A local creator's glowing review of your store blew up. Reputation +"+got.toFixed(0)+" and +25% traffic next month.";}},
  {id:"bulk",w:2,neg:false,kind:"good",title:"💼 Corporate bulk-order opportunity",
   can:st=>!st.bulkPending&&!st.bulkOffer,
   apply(st){const a=arch(st);const units=st.advantage==="lowcost"?150:3;
     const cost=units*effUnitCost(st);const payout=Math.round(units*a.basePrice*1.10);
     st.bulkOffer={units,cost,payout};
     return"A local company wants "+units+" units next month. Buy the stock now for ~$"+cost.toLocaleString()+" and they'll pay $"+payout.toLocaleString()+" — decide in next month's turn.";}},
  {id:"poach",w:1.5,neg:true,kind:"bad",title:"🏃 Key employee poached",
   can:st=>st.staff>=2||st.trained>=1,
   apply(st){if(st.trained>0){st.trained--;st.staff=Math.max(1,st.staff-1);}else st.staff=Math.max(1,st.staff-1);
     repDown(st,2);
     return"A competitor hired away one of your best people. Staff −1, reputation −2. Regulars notice.";}},
  {id:"expo",w:1.5,neg:false,kind:"good",title:"🎪 Tech expo comes to town",
   can:st=>true,
   apply(st){st.nextDemandBonus+=0.15;return"A regional tech expo is bringing gadget lovers downtown next month: +15% traffic.";}},
];
function maybeEvent(st){
  const roll=rng(st);
  const m=st.month;
  if(m===0)return null;
  if(roll>0.45)return null;
  let pool=EVENTS.filter(e=>(!e.once||!st.firedOnce[e.id])&&e.id!==st.lastEventId&&e.can(st));
  if(m<=2)pool=pool.filter(e=>!e.neg);
  else if(m<=4&&st.lastEventNeg)pool=pool.filter(e=>!e.neg);
  if(!pool.length)return null;
  const tw=pool.reduce((x,e)=>x+e.w,0);
  let r=rng(st)*tw,ev=pool[0];
  for(const e of pool){r-=e.w;if(r<=0){ev=e;break;}}
  const desc=ev.apply(st);
  st.lastEventNeg=ev.neg;st.lastEventId=ev.id;
  if(ev.once)st.firedOnce[ev.id]=true;
  st.log.push({m,txt:"EVENT — "+ev.title.replace(/^\S+\s/,"")+": "+desc});
  st.minCash=Math.min(st.minCash,st.cash);
  return{title:ev.title,desc,kind:ev.kind};
}

function bankrupt(st,why){
  st.gameOver=true;st.bankrupt=true;st.phase="bankrupt";
  st.bankruptWhy=why;
  st.log.push({m:st.month,txt:"💀 BANKRUPT — "+why});
}

/* ---------- scoring ---------- */
function finalScore(st){
  const h=st.history;
  const last3=h.slice(-3);
  const avg3=last3.length?Math.round(last3.reduce((x,r)=>x+r.profit,0)/last3.length):0;
  const inv=Math.round(inventoryValue(st)*0.6);
  const su=arch(st).startup;
  let assets=Math.round((su.fixtures+su.pos)*0.4);
  if(st.displays)assets+=IMPROVEMENTS.displays.cost*0.5;
  if(st.demo)assets+=IMPROVEMENTS.demo.cost*0.5;
  if(st.security)assets+=IMPROVEMENTS.security.cost*0.5;
  if(st.services)assets+=SERVICE_LAUNCH*0.5;
  assets=Math.round(assets);
  const debt=totalDebt(st);
  const raw=st.cash+avg3*10+inv+assets-debt;
  const val=Math.max(0,Math.round(raw*(1-st.equity)));
  return{cash:Math.round(st.cash),avg3,profitComponent:avg3*10,inv,assets,
    bankDebt:Math.round(st.bank.balance),famDebt:Math.round(st.fam.balance),debt,
    equity:st.equity,raw:Math.round(raw),valuation:val};
}
function avgCoherence(st){
  const h=st.cohHistory;
  return h.length?h.reduce((x,r)=>x+r.coherence,0)/h.length:st.coherence;
}
function badges(st,score){
  const h=st.history,out=[];
  const holiday=h.filter(r=>r.m===10||r.m===11).reduce((x,r)=>x+r.revenue,0);
  const total=h.reduce((x,r)=>x+r.revenue,0)||1;
  const profMonths=h.filter(r=>r.profit>0).length;
  const avgInv=h.reduce((x,r)=>x+r.invValue,0)/Math.max(1,h.length);
  const avgCogs=h.reduce((x,r)=>x+r.cogs,0)/Math.max(1,h.length);
  const stuckEver=st.cohHistory.some(r=>r.clarity==="stuck");
  if(!st.bankrupt){
    if(st.advantage==="lowcost"&&avgCoherence(st)>=80&&score.valuation>=arch(st).goodScore)out.push("🏆 True Cost Leader");
    if(st.advantage==="premium"&&avgCoherence(st)>=80&&score.valuation>=arch(st).goodScore)out.push("💎 True Differentiator");
    if(st.scope==="niche"&&st.rep>=72&&st.coherence>=80)out.push("🎯 Niche Master");
    if(stuckEver)out.push("😵 Stuck in the Middle");
    if(holiday/total>0.34)out.push("🎄 Holiday Hero");
    if(profMonths>=8)out.push("📈 Lean and Profitable");
    if(avgCogs>0&&avgInv>2.6*avgCogs)out.push("📦 Inventory Hoarder");
    if(st.minCash<1500)out.push("😅 Barely Survived");
    if(st.bank.borrowed===0&&st.equity===0&&st.fam.balance===0)out.push("🦅 Bootstrapped");
    if(st.rep>=75)out.push("⭐ Reputation Star");
    if(!out.length)out.push("🏪 Open for Business");
  }else if(stuckEver)out.push("😵 Stuck in the Middle");
  return out.slice(0,3);
}
function porterVerdict(st){
  const declared=porterName(st.advantage,st.scope);
  const other=st.advantage==="lowcost"?"a differentiator":"a cost leader";
  const firstStuck=st.cohHistory.find(r=>r.clarity==="stuck");
  const everWobbled=st.cohHistory.some(r=>r.clarity!=="strong");
  const worst=st.cohLog.length?st.cohLog.reduce((a,b)=>b.pts>a.pts?b:a):null;
  if(firstStuck)
    return"You declared "+declared+" but spent like "+other+" — you got stuck in the middle around "+MONTH_NAMES[firstStuck.m]+
      (worst?" (biggest drift: "+worst.why+")":"")+". Porter's warning in action: sort-of-cheap, sort-of-premium stores lose both kinds of customers.";
  if(everWobbled)
    return"You declared "+declared+" and mostly executed it, though your clarity wobbled"+
      (worst?" when "+worst.why:"")+". You recovered before customers wrote you off — but the drift had a price.";
  return"Textbook "+declared+". You declared a strategy and every month's spending matched it — customers always knew exactly what "+st.storeName+" stands for.";
}
function strategyNote(st,score){
  const a=arch(st);const v=score.valuation;
  const tier=v>=a.greatScore?"Top-tier":v>=a.goodScore?"Strong":v>=25000?"Solid":"Rough";
  return tier+" result for a "+porterName(st.advantage,st.scope)+" store. (Strategies have different economics — "+
    (st.advantage==="lowcost"?"cost players grind out thin margins on volume.":"premium players ride fewer, bigger, riskier sales.")+")";
}
function debriefQuestions(st){
  const h=st.history,q=[];
  /* Porter question — always first */
  const firstStuck=st.cohHistory.find(r=>r.clarity==="stuck");
  const worst=st.cohLog.length?st.cohLog.reduce((a,b)=>b.pts>a.pts?b:a):null;
  if(firstStuck&&worst)
    q.push("Your clarity meter hit “Stuck in the middle” in "+MONTH_NAMES[firstStuck.m]+" after "+worst.why+". You declared "+porterName(st.advantage,st.scope)+" — which of Porter's strategies were you actually executing, and what would committing have looked like?");
  else if(st.cohLog.length)
    q.push("You drifted off-strategy when "+st.cohLog[0].why+" but recovered. What made you drift, and how did the clarity meter change your later decisions?");
  else
    q.push("You kept your "+porterName(st.advantage,st.scope)+" strategy coherent all 12 months. Where in your numbers can you see the payoff of that discipline?");
  const nov=h.find(r=>r.m===10);
  if(nov&&nov.demand>nov.sold*1.2)
    q.push("You entered the holiday surge in November with only "+((nov.sold===0)?"no":nov.sold+" units of")+" sellable stock while "+nov.demand+" customers wanted to buy. What would you order differently in September–October?");
  const hoard=h.find(r=>r.invValue>3*Math.max(1,r.cogs)&&r.invValue>6000);
  if(hoard)q.push("In "+MONTH_NAMES[hoard.m]+" you held $"+hoard.invValue.toLocaleString()+" of unsold inventory. That cash earned nothing sitting on shelves — what was the opportunity cost?");
  if(st.minCash<2000&&!st.bankrupt)
    q.push("Your cash dropped to $"+Math.max(0,Math.round(st.minCash)).toLocaleString()+" at its lowest point. What decision put you there, and what buffer would you keep next time?");
  if(st.bankrupt)
    q.push("Look at the three biggest cash drains above. Which one was avoidable, and what early-warning sign did you miss?");
  if(st.equity>0)q.push("You gave away "+(st.equity*100)+"% equity, which cut your final valuation by that share. Was the investor cash worth it — did it fund growth or just cover losses?");
  if(st.fam.balance>0)q.push("You still owe family & friends $"+Math.round(st.fam.balance).toLocaleString()+". It was interest-free — but what did the emergency-callback risk actually cost you this year?");
  if(q.length<4)q.push("If you replayed this exact year, what is the ONE decision you'd change first — and roughly how much was it worth?");
  return q.slice(0,4);
}
function biggestDrains(st){
  const cats={};
  for(const l of st.log){
    const m=l.txt.match(/\(−\$([\d,]+)\)/);
    if(m){const amt=+m[1].replace(/,/g,"");
      let cat="Other spending";
      if(/Ordered|bulk order|product line/i.test(l.txt))cat="Inventory purchases";
      else if(/Booked/.test(l.txt))cat="Marketing";
      else if(/Hired|training|Laid off/.test(l.txt))cat="Staffing";
      else if(/Installed|Launched/.test(l.txt))cat="Improvements & services";
      cats[cat]=(cats[cat]||0)+amt;}
  }
  const rec=st.history.reduce((x,r)=>x+r.opEx,0)+(st.recurring?st.recurring.total:0);
  cats["Recurring costs (rent, payroll, bills)"]=rec;
  return Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,3);
}

    el.textContent=fmt(from+(to-from)*e);

/* ---------- cash chart ---------- */
function chartData(){
  const pts=[{m:-1,v:START_CASH}].concat(G.history.map(h=>({m:h.m,v:h.cashEnd})));
  if(!G.gameOver)pts.push({m:G.month,v:Math.round(G.cash)});
  return pts;
}
function chartHTML(animate){
  const pts=chartData();
  const W=1000,H=172,L=52,R=54,T=16,B=26;
  const vals=pts.map(p=>p.v);
  const lo=Math.min(0,...vals), hi=Math.max(START_CASH*1.1,...vals);
  const X=i=>L+(W-L-R)*(pts.length<2?0:i/(pts.length-1));
  const Y=v=>T+(H-T-B)*(1-(v-lo)/((hi-lo)||1));
  const line=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area=line+` L ${X(pts.length-1).toFixed(1)} ${Y(lo).toFixed(1)} L ${X(0).toFixed(1)} ${Y(lo).toFixed(1)} Z`;
  const ticks=[lo,(lo+hi)/2,hi].map(v=>Math.round(v/1000)*1000).filter((v,i,arr)=>arr.indexOf(v)===i);
  const grid=ticks.map(v=>`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>
    <text class="axis-t" x="${L-9}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">$${Math.round(v/1000)}k</text>`).join("");
  const xlab=pts.map((p,i)=>i%2===0||i===pts.length-1
    ?`<text class="axis-t" x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${p.m<0?"Start":MONTH_NAMES[p.m].slice(0,3)}</text>`:"").join("");
  const dots=pts.map((p,i)=>`<circle class="cdot" data-i="${i}" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4"/>`).join("");
  const last=pts[pts.length-1];
  const lab=`<text class="clabel" x="${(X(pts.length-1)+9).toFixed(1)}" y="${(Y(last.v)+4).toFixed(1)}">${fmt(last.v)}</text>`;
  const len=Math.round((W-L-R)*1.35+400);
  return`<div class="card chart-card">
    <div class="chart-head"><h3 style="margin:0">${ic("chart")} Cash over time</h3>
      <span class="tiny">Hover any point for the exact balance</span></div>
    <div class="chart-host" id="chartHost">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Cash balance by month">
        <defs><linearGradient id="cfill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--chart)" stop-opacity=".38"/>
          <stop offset="100%" stop-color="var(--chart)" stop-opacity="0"/></linearGradient></defs>
        ${grid}${xlab}
        <path d="${area}" fill="url(#cfill)"/>
        <path class="cline ${animate?"anim":""}" style="--len:${len}" d="${line}"/>
        <line class="crosshair hidden" id="xhair" y1="${T}" y2="${H-B}"/>
        ${dots}${lab}
      </svg>
      <div class="ctip" id="ctip"></div>
    </div>
  </div>`;
}
function wireChart(){
  const host=$("#chartHost"); if(!host)return;
  const svg=host.querySelector("svg"), tip=$("#ctip"), hair=$("#xhair");
  const pts=chartData(), dots=Array.from(host.querySelectorAll(".cdot"));
  host.addEventListener("mousemove",e=>{
    const r=host.getBoundingClientRect();
    let best=0,bd=1e9;
    dots.forEach((d,i)=>{
      const cx=(+d.getAttribute("cx"))/1000*r.width;
      const dist=Math.abs(cx-(e.clientX-r.left));
      if(dist<bd){bd=dist;best=i;}
    });
    dots.forEach(d=>d.setAttribute("r","4"));
    const d=dots[best]; d.setAttribute("r","6.5");
    const cx=(+d.getAttribute("cx"))/1000*r.width, cy=(+d.getAttribute("cy"))/172*r.height;
    hair.classList.remove("hidden");
    hair.setAttribute("x1",d.getAttribute("cx")); hair.setAttribute("x2",d.getAttribute("cx"));
    tip.style.opacity="1"; tip.style.left=cx+"px"; tip.style.top=cy+"px";
    tip.innerHTML=`${pts[best].m<0?"Opening":MONTH_NAMES[pts[best].m]} · <span class="cv">${fmt(pts[best].v)}</span>`;
  });
  host.addEventListener("mouseleave",()=>{
    tip.style.opacity="0"; hair.classList.add("hidden");
    dots.forEach(d=>d.setAttribute("r","4"));
  });
}
